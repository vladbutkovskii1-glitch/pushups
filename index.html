<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#DDE0D8">
<title>Отжимания 100</title>
<style>
:root{
  --panel:#DDE0D8; --surface:#F6F7F3; --ink:#171A16; --muted:#6C7167;
  --line:#C2C7BB; --amber:#C97C00; --green:#2F7A4F; --red:#A33B2A;
  --mono: ui-monospace,"SF Mono","Roboto Mono","DejaVu Sans Mono",monospace;
  --sans: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--panel); color:var(--ink); font-family:var(--sans);
  font-size:16px; line-height:1.45;
  padding:0 0 env(safe-area-inset-bottom);
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 40px}

/* ── шапка ── */
header{
  padding:calc(14px + env(safe-area-inset-top)) 0 12px;
  border-bottom:2px solid var(--ink);
  display:flex; align-items:flex-end; justify-content:space-between; gap:12px;
}
.brand{font-weight:800;font-size:13px;letter-spacing:.18em;text-transform:uppercase;line-height:1.2}
.brand span{display:block;font-weight:500;letter-spacing:.1em;color:var(--muted);font-size:11px;margin-top:3px}
.mbox{text-align:right;flex-shrink:0}
.mbox .lbl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.mbox .val{font-family:var(--mono);font-size:34px;font-weight:700;line-height:1;letter-spacing:-.02em}
.mbox .sub{font-size:11px;color:var(--muted);font-family:var(--mono)}

/* ── вкладки ── */
nav{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:16px}
nav button{
  flex:1;background:none;border:none;border-bottom:3px solid transparent;
  padding:12px 4px;font-family:var(--sans);font-size:12px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muted);cursor:pointer;
}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--amber)}
nav button:focus-visible{outline:2px solid var(--amber);outline-offset:-2px}

/* ── карточки ── */
.card{background:var(--surface);border:1px solid var(--line);padding:16px;margin-bottom:14px}
.card.flat{background:none;border:none;padding:0}
.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
h2{font-size:19px;font-weight:800;margin:0 0 2px;letter-spacing:-.01em}
.meta{font-size:13px;color:var(--muted);font-family:var(--mono)}
.note{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.5}

/* ── лампы подходов ── */
.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px;margin-top:14px}
.set{
  position:relative;background:var(--panel);border:1px solid var(--line);
  padding:14px 8px 12px;text-align:center;cursor:pointer;font-family:var(--mono);
  transition:background .12s,border-color .12s;
}
.set:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.set .lamp{
  position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;
  background:var(--line);border:1px solid rgba(0,0,0,.18);
}
.set .n{font-size:9px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;font-family:var(--sans);font-weight:700}
.set .r{font-size:30px;font-weight:700;line-height:1.05;letter-spacing:-.03em}
.set .u{font-size:10px;color:var(--muted)}
.set.done{background:#E6EDE7;border-color:var(--green)}
.set.done .lamp{background:var(--green);box-shadow:0 0 7px rgba(47,122,79,.65)}
.set.done .r{color:var(--green)}
.set.active{border-color:var(--amber);background:#F5EBDA}
.set.active .lamp{background:var(--amber);box-shadow:0 0 7px rgba(201,124,0,.7)}
.set.amrap .r{font-size:24px}
.set .tag{font-size:9px;letter-spacing:.1em;color:var(--amber);font-weight:700;font-family:var(--sans)}

/* ── таймер отдыха ── */
.rest{margin-top:14px;border:1px solid var(--amber);background:#F5EBDA;padding:12px 14px;display:none}
.rest.on{display:block}
.rest .row{display:flex;justify-content:space-between;align-items:baseline}
.rest .t{font-family:var(--mono);font-size:32px;font-weight:700;line-height:1;letter-spacing:-.02em}
.rest .lbl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.bar{height:5px;background:var(--line);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--amber);transition:width .95s linear}
.rest .skip{margin-top:10px}

/* ── кнопки ── */
button.btn{
  display:block;width:100%;padding:14px;background:var(--ink);color:var(--surface);
  border:none;font-family:var(--sans);font-size:13px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;cursor:pointer;margin-top:12px;
}
button.btn.ghost{background:none;color:var(--ink);border:1px solid var(--ink)}
button.btn.sm{padding:10px;font-size:11px;margin-top:8px}
button.btn:disabled{opacity:.35;cursor:default}
button.btn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.btnrow{display:flex;gap:8px}
.btnrow .btn{margin-top:8px}

/* ── ввод ── */
input[type=number],input[type=text]{
  width:100%;padding:14px;font-family:var(--mono);font-size:26px;font-weight:700;
  text-align:center;border:1px solid var(--ink);background:var(--surface);color:var(--ink);
}
input:focus{outline:2px solid var(--amber);outline-offset:-1px}

/* ── план ── */
.wk{margin-bottom:18px}
.wk h3{font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin:0 0 8px;
  padding-bottom:5px;border-bottom:1px solid var(--line);color:var(--muted);
  display:flex;justify-content:space-between}
.wk h3 em{font-style:normal;color:var(--amber);font-weight:700}
.sess{display:flex;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px dotted var(--line);
  cursor:pointer;font-size:14px}
.sess:last-child{border-bottom:none}
.sess .d{font-family:var(--mono);font-size:12px;color:var(--muted);width:52px;flex-shrink:0}
.sess .nm{font-weight:700;width:74px;flex-shrink:0;font-size:13px}
.sess .pl{font-family:var(--mono);font-size:12px;color:var(--muted);flex:1;text-align:right}
.sess.ok .nm{color:var(--green)}
.sess.ok .d::after{content:" ✓";color:var(--green)}
.sess.now{background:#F5EBDA;margin:0 -8px;padding-left:8px;padding-right:8px}

/* ── прогресс ── */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.stat{background:var(--surface);padding:12px 8px;text-align:center}
.stat .v{font-family:var(--mono);font-size:24px;font-weight:700;line-height:1.1}
.stat .l{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.chart{display:flex;align-items:flex-end;gap:6px;height:130px;margin-top:16px;
  border-bottom:1px solid var(--ink);padding-bottom:0}
.chart div{flex:1;background:var(--amber);position:relative;min-height:3px}
.chart div span{position:absolute;top:-17px;left:0;right:0;text-align:center;
  font-family:var(--mono);font-size:11px;font-weight:700}
.chart div i{position:absolute;bottom:-17px;left:0;right:0;text-align:center;
  font-family:var(--mono);font-size:9px;color:var(--muted);font-style:normal}
.chartwrap{padding:20px 0 22px}
.hint{font-size:12px;color:var(--muted);line-height:1.55;margin-top:14px}
.hint b{color:var(--ink)}
.warn{border-left:3px solid var(--amber);padding-left:10px;margin-top:12px;font-size:13px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="brand">Отжимания<span>путь к сотне</span></div>
  <div class="mbox">
    <div class="lbl">Максимум</div>
    <div class="val" id="hM">—</div>
    <div class="sub" id="hCyc">—</div>
  </div>
</header>

<nav role="tablist">
  <button role="tab" id="t0" aria-selected="true" onclick="tab(0)">Сегодня</button>
  <button role="tab" id="t1" aria-selected="false" onclick="tab(1)">План</button>
  <button role="tab" id="t2" aria-selected="false" onclick="tab(2)">Прогресс</button>
</nav>

<section id="v0"></section>
<section id="v1" hidden></section>
<section id="v2" hidden></section>

</div>

<script>
"use strict";

/* ══════════ хранилище (с запасным вариантом в памяти) ══════════ */
var mem = null, KEY = "pushups100";
function load(){
  try{ var r = localStorage.getItem(KEY); if(r) return JSON.parse(r); }catch(e){}
  if(mem) return mem;
  return null;
}
function save(){
  mem = S;
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
}

/* ══════════ параметры программы ══════════ */
var START = "2026-08-15";          // суббота, старт цикла 1
var A_BASE = [0.6, 0.7, 0.6, 0.5]; // силовой день: доли от М
var VOL_R  = 0.4;                  // объёмный и технический: доля от М
var DAYS   = [
  {k:"A", nm:"Сила",    off:0, rest:170},
  {k:"B", nm:"Объём",   off:2, rest:75 },
  {k:"C", nm:"Техника", off:4, rest:120}
];
var TECH = ["узкая постановка рук","широкая постановка рук","ноги на возвышении 20–30 см","обычная постановка, пауза 2 сек"];

var S = load() || {
  start: START,
  cycles: [{m:10, date:"2026-08-15"}],   // М по циклам
  log: {"0-1-A":{sets:[10], total:10, done:true}}, // сегодняшний тест уже сдан
  view: null
};
save();

/* ══════════ даты ══════════ */
function d2s(d){ return d.toISOString().slice(0,10); }
function s2d(s){ var p=s.split("-"); return new Date(Date.UTC(+p[0],+p[1]-1,+p[2])); }
function addD(s,n){ var d=s2d(s); d.setUTCDate(d.getUTCDate()+n); return d2s(d); }
function today(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmt(s){ var p=s.split("-"); return p[2]+"."+p[1]; }
var WD=["вс","пн","вт","ср","чт","пт","сб"];
function wd(s){ return WD[s2d(s).getUTCDay()]; }

/* ══════════ расчёт тренировки ══════════
   cycle: 0-based · week: 1..4 · day: A|B|C
   Неделя 1, день A  = ТЕСТ (новый максимум)
   Недели 2–3 день A = база +1 / +2 повторения
   Неделя 4          = разгрузка ×0.6                          */
function sessionId(c,w,k){ return c+"-"+w+"-"+k; }

function sessionDate(c,w,k){
  var sat = addD(S.start, (c*4 + (w-1))*7);
  var off = DAYS.filter(function(d){return d.k===k;})[0].off;
  return addD(sat, off);
}

function mOf(c){ return S.cycles[c] ? S.cycles[c].m : null; }

function plan(c,w,k){
  var M = mOf(c);
  if(k==="A" && w===1) return {type:"test", label:"Тест максимума", sets:[], rest:0,
    tip:"Один подход до технического отказа. Как только таз провис или темп поплыл — стоп. Это твой новый М."};
  if(M===null) return {type:"locked", label:"Ждёт теста", sets:[], rest:0,
    tip:"Сначала сдай тест максимума в субботу этой недели."};

  var dl = (w===4);
  var mult = dl ? 0.6 : 1;
  var bump = dl ? 0 : (w-1);   // нед.2 → +1, нед.3 → +2

  if(k==="A"){
    var sets = A_BASE.map(function(f){
      return Math.max(1, Math.round(M*f*mult) + (dl?0:bump));
    });
    if(!dl) sets.push({amrap:true, est:M+Math.max(0,w-2)});
    return {type:"work", label:dl?"Сила · разгрузка":"Сила", sets:sets, rest:170,
      tip: dl ? "Разгрузка. Легко, без максимума. Тело собирает то, что заработало за три недели."
              : (M>40 ? "М больше 40 — обычные отжимания уже не силовые. Ставь ноги на возвышение 40–50 см или надевай рюкзак 5–10 кг, подходы по 8–12."
                      : "Отдых 2,5–3 мин. В последнем подходе оставь 1–2 повторения в запасе.")};
  }
  if(k==="B"){
    var n = dl ? 6 : (10 + (w-1));
    var r = Math.max(1, Math.round(M*VOL_R));
    return {type:"work", label:dl?"Объём · разгрузка":"Объём", sets:new Array(n).fill(r), rest:75,
      tip:"Отдых 60–90 сек. Здесь не тяжело — здесь много. Гнаться за повторениями нельзя."};
  }
  var n2 = dl ? 3 : 5;
  var r2 = Math.max(1, Math.round(M*VOL_R));
  var mode = TECH[(c*3 + (w-1)) % TECH.length];
  return {type:"work", label:dl?"Техника · разгрузка":"Техника", sets:new Array(n2).fill(r2), rest:120,
    tip:"3 сек вниз, пауза грудью у пола, вверх мощно. На этой неделе — "+mode+"."};
}

/* полный список сессий по порядку */
function allSessions(limitCycles){
  var out=[], nc = Math.max(S.cycles.length+1, 2);
  if(limitCycles) nc = limitCycles;
  for(var c=0;c<nc;c++) for(var w=1;w<=4;w++) DAYS.forEach(function(d){
    out.push({c:c,w:w,k:d.k,nm:d.nm,date:sessionDate(c,w,d.k),id:sessionId(c,w,d.k)});
  });
  return out.sort(function(a,b){return a.date<b.date?-1:1;});
}

function currentSession(){
  if(S.view){ var f=allSessions(9).filter(function(s){return s.id===S.view;}); if(f[0]) return f[0]; }
  var t=today(), all=allSessions(9);
  var ex = all.filter(function(s){return s.date===t;})[0];
  if(ex) return ex;
  var nx = all.filter(function(s){return s.date>=t && !(S.log[s.id]&&S.log[s.id].done);})[0];
  return nx || all[all.length-1];
}

function cycleOfToday(){
  var t=today();
  for(var c=S.cycles.length-1;c>=0;c--) if(sessionDate(c,1,"A")<=t) return c;
  return 0;
}

/* ══════════ звук и вибрация ══════════ */
function beep(){
  try{
    var C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    var a=new C(), o=a.createOscillator(), g=a.createGain();
    o.connect(g); g.connect(a.destination); o.frequency.value=880; o.type="square";
    g.gain.setValueAtTime(.12,a.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.4);
    o.start(); o.stop(a.currentTime+.42);
  }catch(e){}
  try{ navigator.vibrate && navigator.vibrate([120,80,120]); }catch(e){}
}

/* ══════════ таймер отдыха ══════════ */
var tick=null, left=0, full=0;
function startRest(sec){
  stopRest(); left=sec; full=sec; drawRest();
  tick=setInterval(function(){
    left--; drawRest();
    if(left<=0){ stopRest(); beep(); }
  },1000);
}
function stopRest(){ if(tick){clearInterval(tick);tick=null;} left=0; drawRest(); }
function drawRest(){
  var el=document.getElementById("rest"); if(!el) return;
  if(left<=0){ el.className="rest"; return; }
  el.className="rest on";
  document.getElementById("rt").textContent=
    Math.floor(left/60)+":"+String(left%60).padStart(2,"0");
  document.getElementById("rb").style.width=(left/full*100)+"%";
}

/* ══════════ вкладки ══════════ */
var TAB=0;
function tab(i){
  TAB=i;
  for(var j=0;j<3;j++){
    document.getElementById("t"+j).setAttribute("aria-selected", j===i?"true":"false");
    document.getElementById("v"+j).hidden = (j!==i);
  }
  render();
}

/* ══════════ действия ══════════ */
function toggleSet(idx){
  var s=currentSession(), p=plan(s.c,s.w,s.k);
  var L=S.log[s.id] || (S.log[s.id]={sets:[],done:false});
  if(L.sets[idx]!==undefined && L.sets[idx]!==null){ L.sets[idx]=null; }
  else {
    var v=p.sets[idx];
    if(v && v.amrap){
      var a=prompt("Последний подход — максимум. Сколько получилось?", v.est);
      if(a===null) return; v=Math.max(0,parseInt(a,10)||0);
    }
    L.sets[idx]=v;
    startRest(p.rest);
    try{ navigator.vibrate && navigator.vibrate(35); }catch(e){}
  }
  save(); render();
}
function finishSession(){
  var s=currentSession(), L=S.log[s.id]||{sets:[]};
  L.total=L.sets.reduce(function(a,b){return a+(b||0);},0);
  L.done=true; L.date=today(); S.log[s.id]=L; S.view=null;
  stopRest(); save(); render();
}
function saveTest(){
  var v=parseInt(document.getElementById("tin").value,10);
  if(!v||v<1){ alert("Введи число повторений."); return; }
  var s=currentSession();
  S.cycles[s.c]={m:v, date:today()};
  S.log[s.id]={sets:[v], total:v, done:true, date:today()};
  S.view=null; save(); render();
}
function openSess(id){ S.view=id; save(); tab(0); window.scrollTo(0,0); }
function resetSess(){
  var s=currentSession();
  if(!confirm("Сбросить отметки этой тренировки?")) return;
  delete S.log[s.id]; stopRest(); save(); render();
}
function exportData(){
  var blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="otzhimaniya-backup-"+today()+".json";
  a.click();
}
function importData(inp){
  var f=inp.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    try{ S=JSON.parse(r.result); save(); render(); alert("Данные загружены."); }
    catch(e){ alert("Файл не читается — выбери файл резервной копии."); }
  };
  r.readAsText(f);
}
function hardReset(){
  if(!confirm("Стереть всю историю и начать заново? Отменить нельзя.")) return;
  try{ localStorage.removeItem(KEY); }catch(e){}
  mem=null; location.reload();
}

/* ══════════ отрисовка ══════════ */
function render(){
  var c=cycleOfToday(), M=mOf(c);
  document.getElementById("hM").textContent = M===null?"—":M;
  var s=currentSession();
  document.getElementById("hCyc").textContent = "цикл "+(s.c+1)+" · нед "+s.w;

  if(TAB===0) renderToday();
  if(TAB===1) renderPlan();
  if(TAB===2) renderProgress();
}

function renderToday(){
  var s=currentSession(), p=plan(s.c,s.w,s.k), L=S.log[s.id]||{sets:[],done:false};
  var t=today(), when = s.date===t ? "Сегодня" : (s.date<t ? "Пропущено · "+fmt(s.date) : fmt(s.date)+" · "+wd(s.date));
  var h="";

  h+='<div class="card">';
  h+='<div class="eyebrow">'+when+' · цикл '+(s.c+1)+' · неделя '+s.w+'</div>';
  h+='<h2>'+p.label+'</h2>';

  if(p.type==="test"){
    h+='<div class="meta">Разомнись 5 минут. Один подход до отказа.</div>';
    h+='<div class="note">'+p.tip+'</div>';
    if(L.done){
      h+='<div class="note"><b>Результат: '+L.total+'.</b> Программа пересчитана.</div>';
      h+='<button class="btn ghost sm" onclick="resetSess()">Изменить результат</button>';
    }else{
      h+='<div style="margin-top:14px"><input type="number" id="tin" inputmode="numeric" placeholder="0"></div>';
      h+='<button class="btn" onclick="saveTest()">Записать максимум</button>';
    }
    h+='</div>';
  } else if(p.type==="locked"){
    h+='<div class="note">'+p.tip+'</div></div>';
  } else {
    var doneN=0, tot=0, plannedTot=0;
    p.sets.forEach(function(v,i){
      plannedTot += (v&&v.amrap)? v.est : v;
      if(L.sets[i]!==undefined&&L.sets[i]!==null){doneN++;tot+=L.sets[i];}
    });
    h+='<div class="meta">'+p.sets.length+' подхода · план ≈'+plannedTot+' повторений</div>';

    h+='<div class="sets">';
    p.sets.forEach(function(v,i){
      var done=(L.sets[i]!==undefined&&L.sets[i]!==null);
      var next=(!done && doneN===countBefore(L,i));
      var amrap=(v&&v.amrap);
      h+='<button class="set'+(done?' done':'')+(next?' active':'')+(amrap?' amrap':'')+
         '" onclick="toggleSet('+i+')"><span class="lamp"></span>'+
         '<div class="n">Подход '+(i+1)+'</div>'+
         '<div class="r">'+(done? L.sets[i] : (amrap?"МАКС":v))+'</div>'+
         '<div class="'+(amrap?'tag':'u')+'">'+(done?"сделано":(amrap?"≈"+v.est:"повт."))+'</div></button>';
    });
    h+='</div>';

    h+='<div class="rest" id="rest"><div class="row"><div class="lbl">Отдых</div>'+
       '<div class="t" id="rt">0:00</div></div><div class="bar"><i id="rb"></i></div>'+
       '<button class="btn ghost sm skip" onclick="stopRest()">Пропустить отдых</button></div>';

    h+='<div class="note">'+p.tip+'</div>';
    h+='</div>';

    h+='<div class="card flat">';
    h+='<div class="stats"><div class="stat"><div class="v">'+doneN+'/'+p.sets.length+'</div><div class="l">Подходов</div></div>'+
       '<div class="stat"><div class="v">'+tot+'</div><div class="l">Повторений</div></div>'+
       '<div class="stat"><div class="v">'+Math.round(tot/Math.max(plannedTot,1)*100)+'%</div><div class="l">От плана</div></div></div>';
    h+='<div class="btnrow"><button class="btn" onclick="finishSession()" '+(doneN?'':'disabled')+'>'+
       (L.done?"Тренировка закрыта":"Завершить тренировку")+'</button></div>';
    h+='<button class="btn ghost sm" onclick="resetSess()">Сбросить отметки</button>';
    h+='</div>';
  }
  document.getElementById("v0").innerHTML=h;
  drawRest();
}
function countBefore(L,i){
  var n=0; for(var j=0;j<i;j++) if(L.sets[j]!==undefined&&L.sets[j]!==null) n++;
  return n;
}

function renderPlan(){
  var cur=cycleOfToday(), M=mOf(cur), t=today(), h="";
  h+='<div class="card"><div class="eyebrow">Цикл '+(cur+1)+' · максимум '+(M||"—")+'</div>';
  h+='<h2>Четыре недели</h2><div class="meta">сб — сила · пн — объём · ср — техника</div></div>';

  for(var w=1;w<=4;w++){
    h+='<div class="wk"><h3><span>Неделя '+w+'</span>'+(w===4?'<em>разгрузка</em>':(w===1?'<em>тест</em>':''))+'</h3>';
    DAYS.forEach(function(d){
      var p=plan(cur,w,d.k), date=sessionDate(cur,w,d.k), id=sessionId(cur,w,d.k);
      var L=S.log[id], txt;
      if(p.type==="test") txt="до отказа";
      else if(p.type==="locked") txt="—";
      else {
        var g={}, order=[];
        p.sets.forEach(function(v){ var key=(v&&v.amrap)?"макс":v; if(!g[key]){g[key]=0;order.push(key);} g[key]++; });
        txt=order.map(function(k){ return g[k]>1 ? g[k]+"×"+k : String(k); }).join(", ");
      }
      h+='<div class="sess'+(L&&L.done?' ok':'')+(date===t?' now':'')+'" onclick="openSess(\''+id+'\')">'+
         '<span class="d">'+fmt(date)+'</span><span class="nm">'+d.nm+'</span>'+
         '<span class="pl">'+txt+'</span></div>';
    });
    h+='</div>';
  }
  h+='<div class="warn">Прибавка идёт сама: неделя 2 — плюс одно повторение к каждому силовому подходу, неделя 3 — плюс два, неделя 4 — разгрузка, дальше новый тест. Ничего не добавляй сверху.</div>';
  document.getElementById("v1").innerHTML=h;
}

function renderProgress(){
  var h="", ms=S.cycles.filter(function(c){return c&&c.m;});
  var sessions=0, reps=0;
  for(var k in S.log){ if(S.log[k].done){ sessions++; reps+=S.log[k].total||0; } }
  var M=ms.length?ms[ms.length-1].m:0;

  h+='<div class="card"><div class="eyebrow">Итого</div>';
  h+='<div class="stats"><div class="stat"><div class="v">'+M+'</div><div class="l">Максимум</div></div>'+
     '<div class="stat"><div class="v">'+sessions+'</div><div class="l">Тренировок</div></div>'+
     '<div class="stat"><div class="v">'+reps+'</div><div class="l">Повторений</div></div></div>';
  h+='<div class="chartwrap"><div class="chart">';
  var mx=Math.max(100, M);
  ms.forEach(function(c,i){
    h+='<div style="height:'+Math.max(3,c.m/mx*100)+'%"><span>'+c.m+'</span><i>ц'+(i+1)+'</i></div>';
  });
  for(var i=ms.length;i<6;i++) h+='<div style="height:2px;background:var(--line)"><i>ц'+(i+1)+'</i></div>';
  h+='</div></div>';
  h+='<div class="hint">Ориентир по максимуму: <b>~20</b> к концу второго месяца, <b>~35</b> к пятому, <b>~55</b> к восьмому, <b>~75</b> к одиннадцатому, <b>100</b> примерно через год. Медленно — это правильно.</div>';
  h+='</div>';

  h+='<div class="card"><div class="eyebrow">Когда максимум перевалит за 40</div>';
  h+='<div class="hint">Обычные отжимания перестают быть силовым упражнением. В силовой день ставь ноги на возвышение 40–50 см или надевай рюкзак 5–10 кг и работай по 8–12 повторений. С максимума <b>75</b> добавь в день техники один длинный подход в ровном темпе: одно повторение за полторы-две секунды, вдох вниз, выдох вверх. Сотня берётся дыханием, а не силой.</div></div>';

  h+='<div class="card"><div class="eyebrow">Данные</div>';
  h+='<div class="hint">Всё хранится только на этом телефоне. Раз в месяц сохраняй копию — если почистишь данные браузера, история пропадёт.</div>';
  h+='<button class="btn ghost sm" onclick="exportData()">Сохранить копию</button>';
  h+='<label class="btn ghost sm" style="display:block;text-align:center;cursor:pointer">Загрузить копию'+
     '<input type="file" accept="application/json" style="display:none" onchange="importData(this)"></label>';
  h+='<button class="btn ghost sm" style="border-color:var(--red);color:var(--red)" onclick="hardReset()">Начать заново</button>';
  h+='</div>';
  document.getElementById("v2").innerHTML=h;
}

render();
</script>
</body>
</html>
