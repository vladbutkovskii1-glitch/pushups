<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#DDE0D8">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Три упражнения</title>
<style>
:root{
  --panel:#DDE0D8; --surface:#F6F7F3; --ink:#171A16; --muted:#6C7167;
  --line:#C2C7BB; --amber:#C97C00; --green:#2F7A4F; --red:#A33B2A; --blue:#3A5C7A;
  --mono: ui-monospace,"SF Mono","Roboto Mono","DejaVu Sans Mono",monospace;
  --sans: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--panel);color:var(--ink);font-family:var(--sans);
  font-size:18.5px;line-height:1.5;padding:0 0 env(safe-area-inset-bottom);
  -webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 40px}

header{padding:calc(12px + env(safe-area-inset-top)) 0 10px;border-bottom:2px solid var(--ink)}
.brand{font-weight:800;font-size:14.5px;letter-spacing:.18em;text-transform:uppercase}
.brand span{font-weight:500;color:var(--muted);letter-spacing:.1em}
.maxrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.mx{background:var(--surface);border:1px solid var(--line);padding:7px 4px;text-align:center}
.mx .l{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mx .v{font-family:var(--mono);font-size:29.5px;font-weight:700;line-height:1.1}
.mx .g{font-size:11.5px;color:var(--muted);font-family:var(--mono)}

nav{display:flex;border-bottom:1px solid var(--line);margin-bottom:14px}
nav button{flex:1;background:none;border:none;border-bottom:3px solid transparent;
  padding:12px 4px;font-family:var(--sans);font-size:14px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muted);cursor:pointer}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--amber)}

.card{background:var(--surface);border:1px solid var(--line);padding:14px;margin-bottom:12px}
.card.flat{background:none;border:none;padding:0}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
h2{font-size:22px;font-weight:800;margin:0 0 2px;letter-spacing:-.01em}
h3.ex{font-size:18.5px;font-weight:800;margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h3.ex em{font-style:normal;font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--amber);font-weight:700;flex-shrink:0}
.meta{font-size:15px;color:var(--muted);font-family:var(--mono)}
.note{font-size:15.5px;color:var(--muted);margin-top:9px;line-height:1.5}
.exhead{border-left:3px solid var(--ink);padding-left:9px;margin-bottom:2px}

.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(102px,1fr));gap:8px;margin-top:11px}
.set{position:relative;background:var(--panel);border:1px solid var(--line);
  padding:14px 6px 12px;text-align:center;cursor:pointer;font-family:var(--mono);
  transition:background .12s,border-color .12s}
.set .lamp{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;
  background:var(--line);border:1px solid rgba(0,0,0,.18)}
.set .n{font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;
  font-family:var(--sans);font-weight:700}
.set .r{font-size:29.5px;font-weight:700;line-height:1.15;letter-spacing:-.02em}
.set .r.sm{font-size:17.5px;line-height:1.25;padding-top:3px}
.set .u{font-size:11.5px;color:var(--muted)}
.set.done{background:#E6EDE7;border-color:var(--green)}
.set.done .lamp{background:var(--green);box-shadow:0 0 7px rgba(47,122,79,.6)}
.set.done .r{color:var(--green)}
.set.active{border-color:var(--amber);background:#F5EBDA}
.set.active .lamp{background:var(--amber);box-shadow:0 0 7px rgba(201,124,0,.7)}
.set .tag{font-size:11px;letter-spacing:.08em;color:var(--amber);font-weight:700;font-family:var(--sans)}

.rest{position:sticky;bottom:0;margin-top:12px;border:1px solid var(--amber);
  background:#F5EBDA;padding:10px 12px;display:none;z-index:5}
.rest.on{display:block}
.rest .row{display:flex;justify-content:space-between;align-items:baseline}
.rest .t{font-family:var(--mono);font-size:35px;font-weight:700;line-height:1}
.rest .lbl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.bar{height:4px;background:var(--line);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--amber);transition:width .95s linear}

button.btn{display:block;width:100%;padding:13px;background:var(--ink);color:var(--surface);
  border:none;font-family:var(--sans);font-size:14.5px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;cursor:pointer;margin-top:10px}
button.btn.ghost{background:none;color:var(--ink);border:1px solid var(--ink)}
button.btn.sm{padding:10px;font-size:12.5px;margin-top:7px}
button.btn:disabled{opacity:.35}

.tin{display:flex;align-items:center;gap:10px;margin-top:9px}
.tin label{flex:1;font-size:16.5px;font-weight:700}
.tin input{width:104px;padding:12px;font-family:var(--mono);font-size:26.5px;font-weight:700;
  text-align:center;border:1px solid var(--ink);background:var(--surface);color:var(--ink)}

.wk{margin-bottom:16px}
.wk h3{font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 6px;
  padding-bottom:4px;border-bottom:1px solid var(--line);color:var(--muted);
  display:flex;justify-content:space-between}
.wk h3 em{font-style:normal;color:var(--amber);font-weight:700}
.sess{padding:8px 0;border-bottom:1px dotted var(--line);cursor:pointer}
.sess:last-child{border-bottom:none}
.sess .top{display:flex;gap:8px;align-items:baseline;font-size:16px}
.sess .d{font-family:var(--mono);font-size:14.5px;color:var(--muted);width:60px;flex-shrink:0}
.sess .nm{font-weight:700;flex:1}
.sess .lines{font-family:var(--mono);font-size:14px;color:var(--muted);
  margin:4px 0 0 68px;line-height:1.6}
.sess.ok .nm{color:var(--green)}
.sess.ok .d::after{content:" ✓";color:var(--green)}
.sess.now{background:#F5EBDA;margin:0 -8px;padding:8px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.stats.two{grid-template-columns:repeat(2,1fr)}
.stats+.stats{margin-top:1px}
.stat{background:var(--surface);padding:10px 6px;text-align:center}
.stat .v{font-family:var(--mono);font-size:26.5px;font-weight:700;line-height:1.1}
.stat .l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.stat .s{font-family:var(--mono);font-size:11.5px;color:var(--amber);margin-top:3px}
.prog{margin-top:14px}
.prog .ttl{font-size:15px;font-weight:700;display:flex;justify-content:space-between;margin-bottom:4px}
.prog .ttl span{font-family:var(--mono);color:var(--muted);font-weight:400;font-size:14px}
.trk{height:9px;background:var(--line);position:relative;overflow:hidden}
.trk i{display:block;height:100%;background:var(--amber)}
.chart{display:flex;align-items:flex-end;gap:5px;height:96px;margin-top:14px;border-bottom:1px solid var(--ink)}
.chart div{flex:1;background:var(--amber);position:relative;min-height:2px}
.chart div span{position:absolute;top:-16px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:11px;font-weight:700}
.chart div i{position:absolute;bottom:-16px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:10px;color:var(--muted);font-style:normal}
.chartwrap{padding:18px 0 20px}
.mstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.mday{background:var(--panel);border:1px solid var(--line);padding:7px 2px;text-align:center;cursor:pointer}
.mday.sel{border-color:var(--ink);border-width:2px;padding:6px 1px}
.mday .dw{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.mday .dn{font-family:var(--mono);font-size:14.5px;font-weight:700;line-height:1.3}
.mday .dot{width:9px;height:9px;border-radius:50%;margin:4px auto 0;background:var(--line)}
.mbtns{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:9px}
.mbtn{background:var(--panel);border:1px solid var(--line);padding:10px 2px;text-align:center;
  cursor:pointer;font-size:11px;font-weight:700;letter-spacing:.02em;line-height:1.25}
.mbtn b{display:block;font-family:var(--mono);font-size:18.5px;margin-bottom:2px}
.mbtn.on{border-color:var(--ink);border-width:2px;padding:8px 1px}
.frow{display:flex;align-items:center;gap:9px;margin-top:8px}
.frow label{flex:1;font-size:15.5px}
.frow input,.frow select{width:120px;padding:10px;font-family:var(--mono);font-size:18.5px;
  font-weight:700;text-align:center;border:1px solid var(--ink);background:var(--surface);color:var(--ink)}
.frow select{font-size:14.5px;text-align:left}
.kcal{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);margin-top:12px}
.kc{background:var(--surface);padding:12px 8px;text-align:center}
.kc.big{grid-column:1/-1;background:#F5EBDA}
.kc .v{font-family:var(--mono);font-size:27.5px;font-weight:700;line-height:1.1}
.kc.big .v{font-size:36.5px;color:var(--amber)}
.kc .l{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.reward{border-color:var(--amber);background:#F5EBDA}
.quote{font-size:21px;line-height:1.45;font-weight:600;letter-spacing:-.01em;margin:10px 0 8px}
.qa{font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.hint{font-size:15px;color:var(--muted);line-height:1.55;margin-top:12px}
.hint b{color:var(--ink)}
.warn{border-left:3px solid var(--amber);padding-left:10px;margin-top:10px;font-size:15.5px;line-height:1.5;color:var(--muted)}

/* ── знаки отличия ── */
.medal{border:2px solid var(--amber);background:#F5EBDA;padding:16px 14px;margin-bottom:12px}
.medal .k{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--amber);font-weight:800}
.medal h2{font-size:26px;margin:6px 0 4px;line-height:1.15}
.medal .ton{font-family:var(--mono);font-size:16.5px;font-weight:700;color:var(--ink);margin-top:6px}
.medal .ton span{color:var(--muted);font-weight:400;font-size:13px}
.awgrp{margin-top:14px}
.awgrp .t{font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.awgrp .t span{font-family:var(--mono);font-size:12.5px;color:var(--muted);font-weight:400}
.awrow{display:grid;gap:4px}
.aw{background:var(--panel);border:1px solid var(--line);padding:9px 1px 7px;text-align:center;
  font-family:var(--mono);font-size:13px;font-weight:700;color:var(--muted);line-height:1.2}
.aw.got{background:var(--amber);border-color:var(--amber);color:#fff}
.aw.next{border-color:var(--amber);border-width:2px;color:var(--amber);padding:8px 0 6px}
.aw .dt{display:block;font-size:9px;font-weight:400;opacity:.85;margin-top:2px}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="brand">Три упражнения <span id="hCyc"></span></div>
  <div class="maxrow" id="hMax"></div>
</header>

<nav role="tablist">
  <button role="tab" id="t0" aria-selected="true" onclick="tab(0)">Сегодня</button>
  <button role="tab" id="t1" aria-selected="false" onclick="tab(1)">План</button>
  <button role="tab" id="t2" aria-selected="false" onclick="tab(2)">Прогресс</button>
  <button role="tab" id="t3" aria-selected="false" onclick="tab(3)">Тело</button>
  <button role="tab" id="t4" aria-selected="false" onclick="tab(4)">Еда</button>
</nav>

<section id="v0"></section>
<section id="v1" hidden></section>
<section id="v2" hidden></section>
<section id="v3" hidden></section>
<section id="v4" hidden></section>
</div>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════════
   ТРИ УПРАЖНЕНИЯ — карта файла

   1. КОНФИГУРАЦИЯ   все настраиваемые числа и списки. Правь здесь.
   2. СОСТОЯНИЕ      схема данных, версия, миграции, сохранение
   3. ДАТЫ           календарь циклов
   4. ПЛАН           генераторы тренировок (домен)
   5. ЕДА            база продуктов и меню по дням недели (домен)
   6. СТАТИСТИКА     производные расчёты по логу
   7. НАГРАДЫ        знаки отличия и тоннаж
   8. ЗВУК И ТАЙМЕР
   9. ДЕЙСТВИЯ       всё, что меняет состояние
  10. ОТРИСОВКА      вкладки
  11. САМОПРОВЕРКА   утверждения о расчётах
  12. СТАРТ

   Правила, которые держат приложение в рабочем виде:
   • План тренировки замораживается в лог при первой отметке подхода.
     Поэтому изменение программы никогда не переписывает историю задним числом.
   • Статистика читает только лог и никогда не пересчитывает план заново.
   • Любое изменение структуры данных — новая версия SCHEMA и запись в MIGRATIONS.
   • Питание считается из базы продуктов (FOOD_DB), а не хранится готовыми
     числами — меняешь граммовку в меню, БЖУ и ккал пересчитываются сами.
   • Меняешь index.html — подними VERSION в sw.js, иначе телефон покажет старую копию.
   ═══════════════════════════════════════════════════════════════════════════ */


/* ═════════ 1. КОНФИГУРАЦИЯ ═════════ */

var CFG = {
  storeKey:   "trener3",
  legacyKey:  "pushups100",
  start:      "2026-08-15",   /* суббота первой недели первого цикла */
  cycleWeeks: 4,              /* последняя неделя цикла — разгрузочная */
  aheadCycles:3,              /* сколько циклов вперёд держать в календаре */
  body:       {h:null, age:32, act:1.725}   /* значения по умолчанию */
};

/* Дни недели и распределение режимов: A = сила, B = объём, C = техника.
   Тяжёлые дни разнесены так, чтобы в один день не сходилась силовая
   работа на все три упражнения.                                        */
var DAYS = [
  {k:"A", nm:"Суббота",     off:0, map:{pull:"A", push:"A", squat:"B"}},
  {k:"B", nm:"Понедельник", off:2, map:{pull:"C", push:"B", squat:"A"}},
  {k:"C", nm:"Среда",       off:4, map:{pull:"B", push:"C", squat:"C"}}
];
var MODE = {A:"Сила", B:"Объём", C:"Техника"};

/* Описатели упражнений. Добавить четвёртое упражнение = дописать сюда объект
   и функцию плана в секции 4. Больше нигде править не нужно.

   factor — доля веса тела, которую поднимает одно повторение. Нужна для тоннажа.
   volume — лестница знаков за накопленный объём (откалибрована так, чтобы
            ступени приходили примерно с одинаковым интервалом: приседания
            копятся вчетверо быстрее отжиманий и в десятки раз быстрее
            подтягиваний, поэтому лестницы разные).
   records — лестница знаков за максимум в одном подходе.                */
var EX = [
  {key:"pull",  name:"Подтягивания", short:"Подтяг.", goal:25,  factor:1.00,
   volume:[25,50,100,250,500,1000,2500,5000],
   records:[1,3,5,10,15,20,25]},

  {key:"push",  name:"Отжимания",    short:"Отжим.",  goal:100, factor:0.64,
   volume:[250,500,1000,2500,5000,10000,25000,50000],
   records:[20,35,50,75,100]},

  {key:"squat", name:"Приседания",   short:"Присед.", goal:100, factor:0.70,
   volume:[500,1000,2500,5000,10000,25000,50000,100000],
   records:[25,50,75,100]}
];
function exBy(k){ for(var i=0;i<EX.length;i++) if(EX[i].key===k) return EX[i]; return null; }

/* Строки к ступеням объёма — по номеру ступени, а не по упражнению,
   чтобы добавление упражнения не требовало писать новый текст. */
var RUNG_LINES = [
  "Начало положено. Дальше решает не рывок, а повторение.",
  "Это уже не случайность, а привычка.",
  "Тело перестало сопротивляться и начало перестраиваться.",
  "Столько не делают те, кто «собирается начать».",
  "Этот объём меняет уже не форму, а то, что ты можешь.",
  "Такие цифры набирают годами, а не неделями.",
  "На этом уровне тебя держит не мотивация, а режим.",
  "Это не результат тренировок. Это то, чем ты стал."
];

var MOODS = [
  {v:1, t:"Тяжело",  c:"#A33B2A"},
  {v:2, t:"Вяло",    c:"#B06A2E"},
  {v:3, t:"Ровно",   c:"#8A8F84"},
  {v:4, t:"Хорошо",  c:"#5C8F5E"},
  {v:5, t:"Отлично", c:"#2F7A4F"}
];

var QUOTES = [
 ["Капля точит камень не силой, а частым падением.","Овидий"],
 ["Начало — половина всего.","Пифагор"],
 ["Огонь испытывает золото, а несчастье — сильных людей.","Сенека"],
 ["Мы становимся тем, что делаем изо дня в день.","Аристотель"],
 ["Тяжело в учении — легко в походе.","Суворов"],
 ["Через тернии — к звёздам.","латинская поговорка"],
 ["Победи себя — и выиграешь тысячи битв.","приписывается Будде"],
 ["Пока дышу — надеюсь.","Цицерон"],
 ["Дорогу осилит идущий.","латинская поговорка"],
 ["Не потому трудно, что не решаемся; не решаемся, потому что трудно.","Сенека"],
 ["Терпение — спутник мудрости.","Августин"],
 ["Путь в тысячу ли начинается с одного шага.","Лао-цзы"],
 ["Кто хочет — ищет способ, кто не хочет — причину.","народная мудрость"],
 ["Нельзя дважды войти в одну и ту же реку.","Гераклит"],
 ["Управляй своим настроением, иначе оно будет управлять тобой.","Гораций"],
 ["Величайшая слава не в том, чтобы не падать, а в том, чтобы вставать.","Конфуций"],
 ["Всё великое создаётся медленно.","Эпиктет"],
 ["Трудность даёт делу цену.","Монтень"],
 ["Не бойся медленно идти, бойся стоять на месте.","китайская поговорка"],
 ["Долог путь наставлений, краток и убедителен путь примеров.","Сенека"],
 ["Мужество — это сопротивление страху, а не его отсутствие.","стоическая максима"],
 ["Кто не идёт вперёд, тот идёт назад.","латинская поговорка"],
 ["Ничто не даётся без большого труда.","Гораций"],
 ["Порядок — половина дела.","римская поговорка"],
 ["Сила растёт из препятствия, а не из его отсутствия.","стоическая максима"],
 ["Что тяжело в начале, то легко в конце.","персидская поговорка"],
 ["Труд создал самого человека.","античная формула"],

/* ═════════ 2. СОСТОЯНИЕ И МИГРАЦИИ ═════════

   Схема v2.
     S = {
       v:2, start:"ГГГГ-ММ-ДД",
       cycles:[ {pull:N, push:N, squat:N, date:"..."} ],   // максимумы по циклам
       log:{ "цикл-неделя-день": {
               done:bool, date:"...", quote:N|null,
               plan:[ блок ]|null,        // замораживается при первой отметке
               marks:{ "упражнение:индекс": повторений }
             } },
       mood:{ "ГГГГ-ММ-ДД": 1..5 },
       body:{ h, age, act, w:{ "ГГГГ-ММ-ДД": кг } },
       awards:{ "идентификатор": "ГГГГ-ММ-ДД" },
       pending:[ идентификаторы знаков, которые ещё не показаны ],
       seen:[ индексы показанных цитат ],
       rest:{ until: метка времени } | null,
       view: "идентификатор сессии" | null
     }

   Блок замороженного плана:
     {ex, nm, modeName, mode, M, phase, rest, locked,
      sets:[ {t, v, aux, amrap, est, small} ]}
   ─────────────────────────────────────────────────────────────────────── */

var SCHEMA = 2;
var S = null, mem = null, QUIET = false;

function blank(){
  return {v:SCHEMA, start:CFG.start,
          cycles:[{pull:null, push:null, squat:null}],
          log:{}, mood:{}, body:{h:CFG.body.h, age:CFG.body.age, act:CFG.body.act, w:{}},
          awards:{}, pending:[], seen:[], rest:null, view:null};
}
function save(){ mem=S; if(QUIET) return;
  try{ localStorage.setItem(CFG.storeKey, JSON.stringify(S)); }catch(e){} }

function rawLoad(){
  try{ var r=localStorage.getItem(CFG.storeKey); if(r) return JSON.parse(r); }catch(e){}
  return mem;
}

/* Перенос из самого первого приложения (только отжимания) — это вход в схему v1. */
function fromLegacy(){
  try{
    var old=localStorage.getItem(CFG.legacyKey); if(!old) return null;
    var o=JSON.parse(old), n={start:o.start||CFG.start, cycles:[], log:{}, view:null};
    (o.cycles||[]).forEach(function(c){ n.cycles.push({push:c.m, pull:null, squat:null, date:c.date}); });
    for(var k in (o.log||{})) n.log[k]={push:o.log[k].sets||[], pull:[], squat:[], done:false};
    return n;
  }catch(e){ return null; }
}

/* Цепочка миграций: ключ — версия, из которой мигрируем. */
var MIGRATIONS = {
  /* v1 → v2. В v1 отметки лежали массивами по индексам плана: S.log[id].push[3].
     Индекс имел смысл только вместе с текущим кодом генератора, поэтому любое
     изменение программы сдвигало историю. Здесь мы один раз восстанавливаем
     план по коду на момент миграции, замораживаем его в лог и переводим
     отметки в именованные ключи. Дальше история неприкосновенна.          */
  1: function(s){
    s.mood   = s.mood   || {};
    s.body   = s.body   || {h:CFG.body.h, age:CFG.body.age, act:CFG.body.act, w:{}};
    s.body.w = s.body.w || {};
    s.seen   = s.seen   || [];
    s.awards = {}; s.pending = []; s.rest = null;

    var prev = S; S = s;                       /* генераторам нужен доступ к S */
    try{
      for(var id in s.log){
        var L = s.log[id];
        if(L.plan) continue;
        var p = id.split("-");
        var live = buildSession(+p[0], +p[1], p[2]);
        var marks = {};
        if(!live.test){
          live.blocks.forEach(function(b){
            var oldArr = L[b.ex];
            if(!oldArr || !oldArr.length) return;
            (b.sets||[]).forEach(function(x,i){
              if(oldArr[i]!=null) marks[b.ex+":"+i] = oldArr[i];
            });
          });
        }
        var kept = {done:!!L.done, date:L.date||null, quote:(L.quote==null?null:L.quote),
                    marks:marks, plan:null, approx:true};
        if(Object.keys(marks).length) kept.plan = freezeBlocks(live);
        s.log[id] = kept;
      }
    } finally { S = prev; }
    return s;
  }
};

function migrate(s){
  var v = s.v || 1;
  while(v < SCHEMA){
    if(MIGRATIONS[v]) s = MIGRATIONS[v](s);
    v++; s.v = v;
  }
  return s;
}

function bootState(){
  var s = rawLoad() || fromLegacy();
  if(!s) { S = blank(); save(); return; }
  S = migrate(s);
  /* добиваем недостающие поля, если файл пришёл из импорта старой копии */
  if(!S.start)  S.start  = CFG.start;
  if(!S.cycles || !S.cycles.length) S.cycles=[{pull:null, push:null, squat:null}];
  if(!S.log)    S.log    = {};
  if(!S.mood)   S.mood   = {};
  if(!S.body)   S.body   = {h:CFG.body.h, age:CFG.body.age, act:CFG.body.act, w:{}};
  if(!S.body.w) S.body.w = {};
  if(!S.awards) S.awards = {};
  if(!S.pending)S.pending= [];
  if(!S.seen)   S.seen   = [];
  save();
}


/* ═════════ 3. ДАТЫ ═════════ */

function d2s(d){ return d.toISOString().slice(0,10); }
function s2d(s){ var p=s.split("-"); return new Date(Date.UTC(+p[0], +p[1]-1, +p[2])); }
function addD(s,n){ var d=s2d(s); d.setUTCDate(d.getUTCDate()+n); return d2s(d); }
function daysBetween(a,b){ return Math.round((s2d(b)-s2d(a))/86400000); }
function today(){ var d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmt(s){ var p=s.split("-"); return p[2]+"."+p[1]; }
var WDS=["вс","пн","вт","ср","чт","пт","сб"];
function wdShort(x){ return WDS[s2d(x).getUTCDay()]; }

function dayByKey(k){ for(var i=0;i<DAYS.length;i++) if(DAYS[i].k===k) return DAYS[i]; return DAYS[0]; }
function sid(c,w,k){ return c+"-"+w+"-"+k; }
function sdate(c,w,k){
  var sat = addD(S.start, (c*CFG.cycleWeeks + (w-1))*7);
  return addD(sat, dayByKey(k).off);
}
function mOf(c,ex){ return (S.cycles[c] && S.cycles[c][ex]!=null) ? S.cycles[c][ex] : null; }

/* Сколько циклов держать в календаре. Считается от даты старта, поэтому
   приложение не перестаёт работать в заранее назначенный день. */
function horizonCycles(){
  var weeks = Math.floor(Math.max(0, daysBetween(S.start, today()))/7);
  return Math.max(CFG.aheadCycles, Math.floor(weeks/CFG.cycleWeeks) + CFG.aheadCycles);
}
function curCycle(){
  var t=today(), n=horizonCycles();
  for(var c=n-1;c>=0;c--) if(sdate(c,1,"A")<=t) return c;
  return 0;
}
function allSessions(){
  var out=[], n=horizonCycles();
  for(var c=0;c<n;c++) for(var w=1;w<=CFG.cycleWeeks;w++) DAYS.forEach(function(d){
    out.push({c:c, w:w, k:d.k, id:sid(c,w,d.k), date:sdate(c,w,d.k), dayName:d.nm});
  });
  return out.sort(function(a,b){ return a.date<b.date?-1:1; });
}
function currentRef(){
  var all = allSessions();
  if(S.view){ var f=all.filter(function(s){return s.id===S.view;}); if(f[0]) return f[0]; }
  var t=today();
  var ex=all.filter(function(s){return s.date===t;})[0]; if(ex) return ex;
  return all.filter(function(s){return s.date>=t && !(S.log[s.id]&&S.log[s.id].done);})[0] || all[0];
}


/* ═════════ 4. ПЛАН ═════════

   Каждый генератор получает ctx = {mode, w, M, c, dl} и возвращает
   {sets, rest, tip, phase?}. Режим передаётся аргументом — никаких
   глобальных переменных, которые надо выставить перед вызовом.

   Флаг aux у подхода означает «это не само упражнение, а подводящее».
   Такие подходы не идут в счётчики повторений и в тоннаж.               */

function P(text, val, o){ var s={t:text, v:val}; if(o) for(var k in o) s[k]=o[k]; return s; }
function pick(w, arr){ return arr[w-1]; }

/* ── ОТЖИМАНИЯ ── подводящих вариантов нет, всё идёт в счёт */
function pushPlan(x){
  var m=x.mode, w=x.w, M=x.M, dl=x.dl, bump=dl?0:(w-1), a=[], i;
  if(m==="A"){
    [0.6,0.7,0.6,0.5].forEach(function(f){
      var r=Math.max(1, Math.round(M*f*(dl?0.6:1))+bump);
      a.push(P(String(r), r));
    });
    if(!dl) a.push(P("МАКС", M+Math.max(0,w-2), {amrap:true, est:M+Math.max(0,w-2), small:true}));
    return {sets:a, rest:170,
      tip: dl ? "Разгрузка. Легко, без максимума."
              : (M>40 ? "Максимум больше 40 — ставь ноги на возвышение 40–50 см или надевай рюкзак 5–10 кг, подходы по 8–12."
                      : "Отдых 2,5–3 мин. В последнем подходе оставь 1–2 повторения в запасе.")};
  }
  if(m==="B"){
    var base = M<=20?10 : (M<=40?8:7);
    var n = dl?6:(base+(w-1)), r = Math.max(1, Math.round(M*0.4));
    for(i=0;i<n;i++) a.push(P(String(r), r));
    return {sets:a, rest:75, tip:"Отдых 60–90 сек. Здесь не тяжело — здесь много."};
  }
  var n2 = dl?3:5, r2 = Math.max(1, Math.round(M*0.4));
  for(i=0;i<n2;i++) a.push(P(String(r2), r2));
  var v = ["узкая постановка рук","широкая постановка рук","ноги на возвышении 20–30 см","пауза 2 сек внизу"][w-1];
  return {sets:a, rest:120, tip:"3 сек вниз, пауза грудью у пола, вверх мощно. Вариант недели — "+v+"."};
}

/* ── ПОДТЯГИВАНИЯ ── три фазы: до первого, до пятого, дальше проценты.
   В фазе 0 в счёт не идёт ничего: негативы, австралийские и лопаточные —
   это подводящие движения, а не подтягивания. Поэтому счётчик стоит на нуле
   ровно до того дня, когда появится первое чистое повторение.            */
function pullPhase(M){ return M===0 ? 0 : (M<5 ? 1 : 2); }
function pullPlan(x){
  var m=x.mode, w=x.w, M=x.M, dl=x.dl, a=[], i, ph=pullPhase(M);

  if(ph===0){
    if(m==="A"){
      var n=pick(w,[4,5,5,3]), r=pick(w,[3,3,4,3]), sec=pick(w,[5,5,6,5]);
      for(i=0;i<n;i++) a.push(P(r+"×"+sec+" сек", r, {small:true, aux:true}));
      return {phase:0, sets:a, rest:150,
        tip:"Негативы. Подставь табурет, выйди в верхнюю точку, убери ноги и опускайся ровно "+sec+" секунд, считая вслух. Не падай в конце — контролируй до самого низа."};
    }
    if(m==="B"){
      var n2=pick(w,[5,5,6,4]), r2=pick(w,[6,8,10,6]);
      for(i=0;i<n2;i++) a.push(P(String(r2), r2, {aux:true}));
      return {phase:0, sets:a, rest:90,
        tip:"Австралийские подтягивания: перекладина на уровне пояса, ноги на земле, тело прямое, тянешь грудь к перекладине. Чем ближе ноги к перекладине — тем легче."};
    }
    var n3=pick(w,[3,3,4,3]), r3=pick(w,[8,9,10,6]);
    for(i=0;i<n3;i++) a.push(P(r3+" лопат.", r3, {small:true, aux:true}));
    for(i=0;i<3;i++)  a.push(P("вис 25 сек", 0, {small:true, aux:true}));
    return {phase:0, sets:a, rest:75,
      tip:"Лопаточные подтягивания: висишь на прямых руках и тянешь плечи вниз от ушей, руки не сгибаются. Это учит включать спину — без этого подтягивание не появится. Потом просто вис на хват."};
  }

  if(ph===1){
    if(m==="A"){
      var n4=pick(w,[4,5,6,3]);
      for(i=0;i<n4;i++) a.push(P(String(M), M));
      return {phase:1, sets:a, rest:180,
        tip:"Много коротких подходов — так строится первое чистое подтягивание. Отдых 3 мин, каждый подход свежий. Ни одного грязного повторения с рывком."};
    }
    if(m==="B"){
      var n5=pick(w,[8,9,10,6]), r5=Math.max(1, M-1);
      for(i=0;i<n5;i++) a.push(P(String(r5), r5));
      return {phase:1, sets:a, rest:90,
        tip:"Отдых 90 сек. Никогда не до отказа — как только чувствуешь, что следующее будет рывком, подход закончен."};
    }
    for(i=0;i<4;i++) a.push(P("12 австр.", 12, {small:true, aux:true}));
    for(i=0;i<3;i++) a.push(P("8 лопат.",   8, {small:true, aux:true}));
    return {phase:1, sets:a, rest:75,
      tip:"Австралийские + лопаточные. Лёгкий день, он держит объём спины без нагрузки на локти."};
  }

  var bump=dl?0:(w-1);
  if(m==="A"){
    [0.6,0.7,0.6,0.5].forEach(function(f){
      var r=Math.max(1, Math.round(M*f*(dl?0.6:1))+bump); a.push(P(String(r), r));
    });
    if(!dl) a.push(P("МАКС", M+Math.max(0,w-2), {amrap:true, est:M+Math.max(0,w-2), small:true}));
    return {phase:2, sets:a, rest:180,
      tip: dl ? "Разгрузка."
              : "Отдых 3 мин. В последнем подходе оставь одно повторение в запасе. "+
                (M>12 ? "Максимум выше 12 — добавь рюкзак 5 кг и работай по 5–8." : "")};
  }
  if(m==="B"){
    var b6 = M<=8?8 : (M<=15?6:5);
    var n6 = dl?5:(b6+(w-1)), r6 = Math.max(1, Math.round(M*(M>15?0.35:0.4)));
    for(i=0;i<n6;i++) a.push(P(String(r6), r6));
    return {phase:2, sets:a, rest:100,
      tip:"Отдых 90–120 сек. Объём строит подтягивания лучше, чем работа до отказа."};
  }
  var n7=dl?3:4, r7=Math.max(1, Math.round(M*0.4));
  for(i=0;i<n7;i++) a.push(P(String(r7), r7));
  a.push(P("12 австр.", 12, {small:true, aux:true}));
  return {phase:2, sets:a, rest:90,
    tip:"3 секунды вниз, пауза внизу на прямых руках. Медленное опускание — то, что делает хват и спину крепкими."};
}

/* ── ПРИСЕДАНИЯ ── в силовом дне в счёт идут только темповые приседания;
   ягодичный мостик и стульчик у стены — другие упражнения, они подводящие. */
function squatPlan(x){
  var m=x.mode, w=x.w, M=x.M, c=x.c, dl=x.dl, a=[], i;
  if(m==="A"){
    var step=Math.min(c||0, 4);
    var n  = dl?3:4;
    var r  = dl ? Math.max(5, Math.min(12, Math.round(M*0.3)))
                : Math.max(6, Math.min(15, Math.round(M*0.35)+(w-1)));
    var capped = (!dl && Math.round(M*0.35)+(w-1) > 15);
    for(i=0;i<n;i++) a.push(P(r+" темп", r, {small:true}));

    var nb = dl?2:3, rb = dl ? 10 : Math.min(25, 12 + 2*(w-1) + 2*step);
    for(i=0;i<nb;i++) a.push(P(rb+" мост", rb, {small:true, aux:true}));

    var sc = dl ? 25 : Math.min(60, 30 + 5*(w-1) + 5*step);
    for(i=0;i<2;i++) a.push(P(sc+" сек", 0, {small:true, aux:true}));

    var extra = capped ? " Повторения дошли до потолка — дальше усложняй только весом: рюкзак 5–8 кг, потом 10–12. Глубину и количество не увеличивай."
              : step>=3 ? " Ты уже несколько циклов на этом — надень рюкзак 5–8 кг, но глубину не увеличивай."
              : step>=1 ? " Мостик делай с ногами на возвышении 20 см — так ягодицы включаются сильнее."
              : "";
    return {sets:a, rest:90,
      tip:"Три упражнения подряд. <b>Темповые приседания</b> — 4 секунды вниз, 2 секунды пауза, вверх мощно; вес держи на всей стопе, колени разводи наружу по линии носков. <b>Ягодичный мостик</b> — лёжа на спине, поднимаешь таз, колени не нагружаются вообще; слабые колени почти всегда идут в паре со слабыми ягодицами, поэтому это здесь не для галочки. <b>Стульчик у стены</b> — спина к стене, бёдра параллельно полу, держишь время; статика укрепляет сухожилия колена без движения в суставе."+extra};
  }
  if(m==="B"){
    var n2 = dl ? (M>40?3:4) : (M>40?5:7);
    var r2 = dl ? Math.max(5, Math.round(M*0.45))
                : Math.max(5, Math.round(M*(0.50+0.07*(w-1))));
    for(i=0;i<n2;i++) a.push(P(String(r2), r2));
    if(!dl) a.push(P("МАКС", M+(w-1)*2, {amrap:true, est:M+(w-1)*2, small:true}));
    return {sets:a, rest:75,
      tip:"Отдых 60–90 сек. Последний подход — на максимум, именно он двигает цифру к сотне. Дыши: вдох вниз, выдох вверх, не задерживай. <b>Про колени:</b> жжение в мышцах — норма, тянущая или острая боль в самом колене — нет. Если колени отзываются, приседай до чуть выше параллели и держи эту глубину пару циклов, объём при этом не снижай."};
  }
  var n3=dl?3:4, r3=Math.max(4, Math.round(M*0.45));
  for(i=0;i<n3;i++) a.push(P(String(r3), r3));
  return {sets:a, rest:90,
    tip:"Темп: 3 сек вниз, пауза 2 сек внизу, вверх мощно. Пятки не отрываются, колени разводи наружу — сведённые внутрь колени и есть главная причина, по которой они болят. Если пятки отрываются, подложи под них книгу: это не костыль, а способ приседать глубже без перегрузки колена, пока голеностоп не станет подвижнее."};
}

var PLANNERS = {pull:pullPlan, push:pushPlan, squat:squatPlan};

/* ── ДОПОЛНИТЕЛЬНЫЙ БЛОК ──
   Суббота — корпус. Среда — задняя поверхность бедра и боковая устойчивость.
   Понедельник не трогаем: самый загруженный будний день.
   Этот блок не относится ни к одному из трёх упражнений и в их счётчики
   не входит вообще — у него ключ "extra", которого нет в описателях EX. */
function extraPlan(w,k,c){
  var dl=(w===CFG.cycleWeeks), step=Math.min(c||0,4), a=[], i;

  if(k==="A"){
    var n=dl?2:3, sec=dl?15:Math.min(60, 20+5*(w-1)+5*step);
    for(i=0;i<n;i++) a.push(P(sec+" сек", 0, {small:true, aux:true}));
    return {ex:"extra", nm:"Корпус", modeName:"Полая позиция"+(dl?" · разгрузка":""),
      sets:a, rest:75, M:"—",
      tip:"Лёжа на спине: поясница прижата к полу, лопатки и ноги оторваны от пола, руки вдоль тела. Если поясница отрывается — согни колени, так легче. Это не пресс ради пресса: без жёсткого корпуса таз провисает в отжиманиях и раскачивается на турнике."};
  }

  var nh=dl?2:3, rh=dl?5:(6+2*(w-1)+step);
  for(i=0;i<nh;i++) a.push(P(rh+" сгиб", rh, {small:true, aux:true}));
  var sp=dl?15:Math.min(45, 20+5*(w-1)+5*step);
  for(i=0;i<2;i++) a.push(P(sp+" сек", 0, {small:true, aux:true}));

  return {ex:"extra", nm:"Задняя поверхность и бок", modeName:"Бицепс бедра"+(dl?" · разгрузка":""),
    sets:a, rest:75, M:"—",
    tip:"<b>Сгибание ног со скольжением</b> — лёжа на спине, пятки на полотенце на гладком полу, поднимаешь таз и медленно выпрямляешь ноги, потом подтягиваешь пятки обратно, таз при этом не опускаешь. Это то, чего в программе не хватало: колено держится балансом квадрицепса и бицепса бедра, а тренировался у нас только первый. <b>Боковая планка</b> — на предплечье, тело в линию, время указано на каждую сторону; она укрепляет среднюю ягодичную, из-за слабости которой колено и заваливается внутрь."};
}

/* Живая сборка тренировки по текущему коду. */
function buildSession(c,w,k){
  var day = dayByKey(k);
  var out = {id:sid(c,w,k), c:c, w:w, k:k, date:sdate(c,w,k), dayName:day.nm, blocks:[]};
  if(w===1 && k==="A"){ out.test=true; return out; }
  var dl = (w===CFG.cycleWeeks);
  EX.forEach(function(e){
    var M = mOf(c, e.key);
    if(M===null){ out.blocks.push({ex:e.key, nm:e.name, locked:true}); return; }
    var mode = day.map[e.key];
    var p = PLANNERS[e.key]({mode:mode, w:w, M:M, c:c, dl:dl});
    p.ex=e.key; p.nm=e.name; p.M=M; p.mode=mode;
    p.modeName = MODE[mode] + (dl?" · разгрузка":"");
    out.blocks.push(p);
  });
  if((k==="A"||k==="C") && mOf(c,"squat")!==null) out.blocks.push(extraPlan(w,k,c));
  return out;
}

/* Сжатый снимок плана для лога: без советов — они не данные, а текст,
   и должны всегда браться из свежего кода. */
function freezeBlocks(live){
  return (live.blocks||[]).map(function(b){
    if(b.locked) return {ex:b.ex, nm:b.nm, locked:true};
    return {ex:b.ex, nm:b.nm, modeName:b.modeName, mode:b.mode, M:b.M,
            phase:b.phase, rest:b.rest,
            sets:(b.sets||[]).map(function(x){
              return {t:x.t, v:x.v, aux:!!x.aux, amrap:!!x.amrap,
                      est:(x.est==null?null:x.est), small:!!x.small};
            })};
  });
}
function freezePlan(id, live){
  var L=logOf(id);
  if(!L.plan){ L.plan = freezeBlocks(live); save(); }
  return L.plan;
}

/* То, что показывает интерфейс: начатая тренировка берётся из лога
   (структура заморожена), не начатая — из свежего кода.
   Советы всегда свежие, даже для старых тренировок.                 */
function getSession(c,w,k){
  var s = buildSession(c,w,k);
  var L = S.log[s.id];
  if(L && L.plan && L.plan.length){
    s.frozen = true;
    s.blocks = L.plan.map(function(fb){
      var live = s.blocks.filter(function(b){ return b.ex===fb.ex; })[0] || {};
      return {ex:fb.ex, nm:fb.nm, locked:fb.locked, modeName:fb.modeName, mode:fb.mode,
              M:fb.M, phase:fb.phase, rest:fb.rest, sets:fb.sets||[],
              tip: live.tip || "Эта тренировка записана раньше — раскладка сохранена такой, какой ты её делал."};
    });
  }
  return s;
}

/* Одна порция: КБЖУ, вес на тарелке (крупы считаются уже разваренными)
   и прикидка стоимости. */
function foodCalc(key, grams){
  var f=FOOD_DB[key];
  if(!f) return {kcal:0,p:0,f:0,c:0,fib:0,mass:0,rub:0};
  var n    = f.perUnit ? grams : grams/100;
  var raw  = f.perUnit ? grams*(f.unitG||50) : grams;
  return {kcal:f.kcal*n, p:f.p*n, f:f.f*n, c:f.c*n, fib:(f.fib||0)*n,
          mass: raw*(f.cook||1), rub: (f.price||0)*raw/1000};
}
function addTo(t,v){ t.kcal+=v.kcal; t.p+=v.p; t.f+=v.f; t.c+=v.c; t.fib+=v.fib; t.mass+=v.mass; t.rub+=v.rub; return t; }
function blankTot(){ return {kcal:0,p:0,f:0,c:0,fib:0,mass:0,rub:0}; }
function mealTotals(items){
  var t=blankTot();
  (items||[]).forEach(function(it){ addTo(t, foodCalc(it[0], it[1])); });
  return t;
}
function dayTotals(dayMeals){
  var t=blankTot();
  (dayMeals||[]).forEach(function(meal){ addTo(t, mealTotals(meal.items)); });
  return t;
}

/* ═════════ 6. СТАТИСТИКА ═════════
   Всё считается только по логу. План здесь не пересобирается никогда. */

function logOf(id){
  if(!S.log[id]) S.log[id] = {done:false, date:null, quote:null, plan:null, marks:{}};
  if(!S.log[id].marks) S.log[id].marks = {};
  return S.log[id];
}
function markKey(ex, i){ return ex+":"+i; }

function doneCount(){ var n=0; for(var k in S.log) if(S.log[k].done) n++; return n; }

/* Реальные повторения по каждому из трёх упражнений: только сами
   подтягивания, отжимания и приседания. Подводящие движения (aux) и блок
   "Корпус / Задняя поверхность" в счёт не идут.                        */
function exReps(){
  var out={}; EX.forEach(function(e){ out[e.key]=0; });
  for(var id in S.log){
    var L=S.log[id];
    if(!L.done || !L.plan) continue;
    L.plan.forEach(function(b){
      if(b.locked || !(b.ex in out)) return;
      (b.sets||[]).forEach(function(x,i){
        var v = L.marks[markKey(b.ex,i)];
        if(v!=null && !x.aux) out[b.ex] += v;
      });
    });
  }
  return out;
}

/* Максимум, когда-либо показанный в тесте. */
function bestRecord(exKey){
  var best=0;
  for(var i=0;i<S.cycles.length;i++){
    var c=S.cycles[i];
    if(c && c[exKey]!=null && c[exKey]>best) best=c[exKey];
  }
  return best;
}
function lastRecord(exKey){
  for(var i=S.cycles.length-1;i>=0;i--){
    var c=S.cycles[i];
    if(c && c[exKey]!=null) return c[exKey];
  }
  return null;
}

function lastWeight(){
  var ks=Object.keys(S.body.w||{}).sort();
  return ks.length ? S.body.w[ks[ks.length-1]] : null;
}

/* Тоннаж: сколько килограммов поднято этим упражнением.
   Считается по текущему весу тела, поэтому это оценка, а не бухгалтерия. */
function tonnage(exKey, reps){
  var w=lastWeight(), e=exBy(exKey);
  if(!w || !e) return null;
  return reps * e.factor * w;
}
function fmtMass(kg){
  if(kg==null) return null;
  if(kg < 1000) return Math.round(kg)+" кг";
  var t = kg/1000;
  return (t<10 ? t.toFixed(1) : String(Math.round(t)))+" т";
}
function shortN(n){
  if(n<1000) return String(n);
  var k=n/1000;
  return (k%1 ? k.toFixed(1) : String(k))+"к";
}

function moodDays(n){
  var out=[], t=today();
  for(var i=n-1;i>=0;i--) out.push(addD(t,-i));
  return out;
}
function moodStats(n){
  var days=moodDays(n), tr=[], rest=[], all=[], trainDates={};
  for(var k in S.log) if(S.log[k].done && S.log[k].date) trainDates[S.log[k].date]=1;
  days.forEach(function(d){
    var m=S.mood[d]; if(m==null) return;
    all.push(m); (trainDates[d]?tr:rest).push(m);
  });
  function avg(a){ return a.length ? (a.reduce(function(x,y){return x+y;},0)/a.length) : null; }
  return {all:avg(all), train:avg(tr), rest:avg(rest), n:all.length, nt:tr.length};
}

/* Калории: формула Миффлина–Сан Жеора. Оценка, а не истина —
   реальную поправку дают весы. */
function calc(){
  var w=lastWeight(), h=S.body.h, age=S.body.age, act=S.body.act;
  if(!w || !h) return null;
  var bmr  = 10*w + 6.25*h - 5*age + 5;
  var tdee = bmr*act;
  var gain = tdee + 300;
  var prot = Math.round(w*1.8);
  var fat  = Math.round(w*1.0);
  var carb = Math.round((gain - prot*4 - fat*9)/4);
  return {bmr:Math.round(bmr), tdee:Math.round(tdee), gain:Math.round(gain),
          prot:prot, fat:fat, carb:Math.max(0,carb),
          weekGain:Math.round(w*0.004*10)/10};
}


/* ═════════ 7. НАГРАДЫ ═════════

   Два семейства знаков:
     vol:<упражнение>:<число>  — накопленный объём
     rec:<упражнение>:<число>  — максимум в одном подходе
   Знак никогда не отзывается: если счётчик потом упадёт (сброс тренировки,
   импорт старой копии), дата получения остаётся. Так и честнее, и устойчивее.  */

function awardId(kind, exKey, n){ return kind+":"+exKey+":"+n; }
function awardInfo(id){
  var p = id.split(":"), kind=p[0], e=exBy(p[1]), n=+p[2];
  if(!e) return null;
  var rung = (kind==="vol") ? e.volume.indexOf(n) : e.records.indexOf(n);

  if(kind==="rec" && e.key==="pull" && n===1){
    return {kind:"rec", ex:e, n:n, eyebrow:"Знак отличия",
      title:"Первое чистое подтягивание",
      line:"Единственная цифра в этой программе, которая начинается с нуля и долго на нём стоит. Всё, что было до этого дня — негативы, австралийские, вис — существовало ради одного этого повторения. Дальше счётчик наконец пойдёт."};
  }
  if(kind==="rec"){
    return {kind:"rec", ex:e, n:n, eyebrow:"Новый рекорд",
      title:n+" "+repWord(e.key,n)+" за подход",
      line:(n>=e.goal ? "Цель по этому упражнению взята. Дальше — держать и усложнять."
                      : "До цели осталось "+(e.goal-n)+".")};
  }
  return {kind:"vol", ex:e, n:n, eyebrow:"Знак отличия",
    title:shortN(n)+" "+repWord(e.key, n),
    line: RUNG_LINES[Math.max(0, Math.min(RUNG_LINES.length-1, rung))]};
}
/* «250 отжиманий», «1 подтягивание» — склонение по числу */
var WORDS = {
  pull:  ["подтягивание","подтягивания","подтягиваний"],
  push:  ["отжимание","отжимания","отжиманий"],
  squat: ["приседание","приседания","приседаний"]
};
function repWord(exKey, n){
  var f = WORDS[exKey]; if(!f) return "повторений";
  var a=Math.abs(n)%100, b=a%10;
  if(a>10 && a<20) return f[2];
  if(b>1 && b<5)   return f[1];
  if(b===1)        return f[0];
  return f[2];
}

/* Пересчитать все пороги. reveal=true — новые знаки уйдут в очередь показа.
   Возвращает список выданных идентификаторов.                            */
function checkAwards(reveal){
  var reps = exReps(), fresh = [], d = today();
  EX.forEach(function(e){
    e.volume.forEach(function(n){
      var id = awardId("vol", e.key, n);
      if(reps[e.key] >= n && !S.awards[id]){ S.awards[id]=d; fresh.push(id); }
    });
    var best = bestRecord(e.key);
    e.records.forEach(function(n){
      var id = awardId("rec", e.key, n);
      if(best >= n && !S.awards[id]){ S.awards[id]=d; fresh.push(id); }
    });
  });
  if(fresh.length){
    if(reveal) S.pending = (S.pending||[]).concat(fresh);
    save();
  }
  return fresh;
}


/* ═════════ 8. ЗВУК И ТАЙМЕР ═════════ */

function tone(x, f, t0, dur, gain, type){
  var o=x.createOscillator(), g=x.createGain();
  o.type = type||"triangle"; o.frequency.value = f;
  o.connect(g); g.connect(x.destination);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain, t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.start(t0); o.stop(t0+dur+0.05);
}
function audio(){
  try{ var C=window.AudioContext||window.webkitAudioContext; return C? new C() : null; }
  catch(e){ return null; }
}
/* конец отдыха */
function beep(){
  var x=audio();
  if(x) tone(x, 880, x.currentTime, 0.4, 0.12, "square");
  try{ navigator.vibrate && navigator.vibrate([120,80,120]); }catch(e){}
}
/* тренировка закрыта */
function sndDone(){
  var x=audio();
  if(x){
    var n=x.currentTime;
    [[523.25,0,.16,.10],[659.25,.10,.16,.10],[783.99,.20,.18,.11],
     [1046.50,.32,.60,.13],[1318.51,.36,.55,.08]]
      .forEach(function(a){ tone(x, a[0], n+a[1], a[2], a[3]); });
    tone(x, 130.81, n, 0.9, 0.09, "sine");
  }
  try{ navigator.vibrate && navigator.vibrate([40,30,40,30,90]); }catch(e){}
}
/* знак отличия — длиннее и «шире», чтобы не путалось с обычным закрытием */
function sndAward(){
  var x=audio();
  if(x){
    var n=x.currentTime;
    [392.00,523.25,659.25,783.99,1046.50].forEach(function(f,i){
      tone(x, f, n+i*0.085, 0.22, 0.10);
    });
    [1046.50,1318.51,1567.98].forEach(function(f){ tone(x, f, n+0.46, 1.30, 0.10); });
    tone(x, 130.81, n+0.42, 1.60, 0.11, "sine");
    tone(x,  65.41, n+0.42, 1.80, 0.09, "sine");
  }
  try{ navigator.vibrate && navigator.vibrate([60,40,60,40,60,60,200]); }catch(e){}
}

/* Таймер отдыха хранит метку времени окончания, а не оставшиеся секунды.
   Поэтому он переживает погашенный экран, сворачивание и перезагрузку
   страницы: setInterval здесь нужен только чтобы перерисовать цифру.   */
var tick=null, beeped=false;
function restLeft(){
  if(!S.rest || !S.rest.until) return 0;
  return Math.max(0, Math.ceil((S.rest.until - Date.now())/1000));
}
function startRest(sec){
  S.rest = {until: Date.now() + sec*1000, full: sec};
  beeped = false; save(); runTick(); drawRest();
}
function stopRest(){
  S.rest = null; save();
  if(tick){ clearInterval(tick); tick=null; }
  drawRest();
}
function runTick(){
  if(tick) return;
  tick = setInterval(function(){
    var l = restLeft();
    drawRest();
    if(l<=0){
      if(!beeped){ beeped=true; beep(); notify("Отдых окончен","Следующий подход."); }
      S.rest=null; save();
      clearInterval(tick); tick=null;
      drawRest();
    }
  }, 1000);
}
function drawRest(){
  var el=document.getElementById("rest"); if(!el) return;
  var l=restLeft();
  if(l<=0){ el.className="rest"; return; }
  el.className="rest on";
  var t=document.getElementById("rt"), b=document.getElementById("rb");
  if(t) t.textContent = Math.floor(l/60)+":"+String(l%60).padStart(2,"0");
  if(b) b.style.width = (l/((S.rest&&S.rest.full)||l)*100)+"%";
}

/* ── уведомления ── */
function notifyOn(){ return typeof Notification!=="undefined" && Notification.permission==="granted"; }
function askNotify(){
  if(typeof Notification==="undefined"){ alert("Этот браузер не умеет показывать уведомления."); return; }
  Notification.requestPermission().then(function(){ render(); });
}
function notify(title, body){
  if(!notifyOn()) return;
  try{
    if(navigator.serviceWorker && navigator.serviceWorker.ready){
      navigator.serviceWorker.ready.then(function(reg){
        reg.showNotification(title, {body:body, icon:"./icon-192.png", badge:"./icon-192.png",
          vibrate:[120,80,120], tag:"rest", renotify:true});
      }).catch(function(){});
    } else { new Notification(title, {body:body, icon:"./icon-192.png"}); }
  }catch(e){}
}

var TAB=0, MSEL=null, PLAYED={};

function tab(i){
  TAB=i;
  for(var j=0;j<5;j++){
    document.getElementById("t"+j).setAttribute("aria-selected", j===i?"true":"false");
    document.getElementById("v"+j).hidden = (j!==i);
  }
  render();

function toggle(ex, idx){
  var r=currentRef(), live=buildSession(r.c,r.w,r.k), L=logOf(r.id);
  /* первая отметка замораживает раскладку тренировки */
  if(!L.plan) freezePlan(r.id, live);

  var blk = L.plan.filter(function(b){ return b.ex===ex; })[0];
  if(!blk || blk.locked) return;
  var key = markKey(ex, idx);

  if(L.marks[key] != null){
    delete L.marks[key];
  } else {
    var st = blk.sets[idx], v = st.v;
    if(st.amrap){
      var ans = prompt("Последний подход на максимум. Сколько получилось?", st.est);
      if(ans===null) return;
      v = Math.max(0, parseInt(ans,10) || 0);
    }
    L.marks[key] = v;
    startRest(blk.rest);
    try{ navigator.vibrate && navigator.vibrate(35); }catch(e){}
  }
  save(); redrawToday();
}

function finish(){
  var r=currentRef(), L=logOf(r.id);
  if(L.done){ S.view=null; save(); render(); return; }
  L.done=true; L.date=today();
  S.view=null; stopRest(); save();
  checkAwards(true);
  save(); render();
  sndDone();
}
function nextAward(){

  save(); render();
}

  o.date=today();

function getQuote(){
  var r=currentRef(), L=logOf(r.id);
  if(L.quote==null){
    if(!S.seen) S.seen=[];
    if(S.seen.length>=QUOTES.length) S.seen=[];
    var free=[];
    for(var i=0;i<QUOTES.length;i++) if(S.seen.indexOf(i)<0) free.push(i);
    var idx=free[Math.floor(Math.random()*free.length)];
    S.seen.push(idx); L.quote=idx; save();
  }
  render();
}

function setMood(v){

function setBody(field, val){

    }catch(e){ alert("Файл не читается."); }
  };
  rd.readAsText(f);
}
function hardReset(){

}

function moodColor(v){ for(var i=0;i<MOODS.length;i++) if(MOODS[i].v===v) return MOODS[i].c; return null; }

/* Карточка вручения знака. Показывается поверх всего, по одному знаку за раз. */
function medalCard(){
  if(!S.pending || !S.pending.length) return "";
  var id=S.pending[0], a=awardInfo(id);
  if(!a){ S.pending.shift(); save(); return ""; }
  if(!PLAYED[id]){ PLAYED[id]=true; setTimeout(sndAward, 120); }

  var h='<div class="medal"><div class="k">'+a.eyebrow+'</div><h2>'+a.title+'</h2>';
  if(a.kind==="vol"){
    var reps=exReps()[a.ex.key], m=fmtMass(tonnage(a.ex.key, reps));
    if(m) h+='<div class="ton">поднято '+m+' <span>· по текущему весу тела</span></div>';
  }
  h+='<div class="note">'+a.line+'</div>';
  h+='<button class="btn" onclick="nextAward()">'+
     (S.pending.length>1 ? "Дальше · ещё "+(S.pending.length-1) : "Дальше")+'</button></div>';
  return h;
}

function renderToday(){
  var r=currentRef(), s=getSession(r.c,r.w,r.k), L=S.log[s.id]||{marks:{}}, t=today();
  var marks = L.marks || {};
  var when = s.date===t ? "Сегодня" : (s.date<t ? "Пропущено · "+fmt(s.date) : fmt(s.date));
  var h = medalCard() + moodCard();

  h+='<div class="card"><div class="eyebrow">'+when+' · '+s.dayName+' · цикл '+(s.c+1)+' · неделя '+s.w+'</div>';

  if(s.test){
    h+='<h2>Тест максимумов</h2>';
    h+='<div class="meta">разомнись 5–7 минут, отдых между тестами 3 мин</div>';
    h+='<div class="note">По одному подходу до технического отказа в каждом упражнении. Как только техника поплыла — стоп. Ноль в подтягиваниях — нормальный честный результат, программа его учтёт.</div>';
    EX.forEach(function(e){
      var v=mOf(s.c, e.key); v = (v==null?"":v);
      h+='<div class="tin"><label>'+e.name+'</label>'+
         '<input type="number" inputmode="numeric" id="ti_'+e.key+'" value="'+v+'" placeholder="0"></div>';
    });
    h+='<button class="btn" onclick="saveTest()">Записать максимумы</button>';
    if(L.done) h+='<button class="btn ghost sm" onclick="resetSess()">Сбросить</button>';
    h+='</div>';
    document.getElementById("v0").innerHTML=h; drawRest(); return;
  }

  h+='<h2>'+s.dayName+'</h2><div class="meta">упражнения по порядку сверху вниз</div></div>';

  var totDone=0, totAll=0, reps=0;
  s.blocks.forEach(function(b){
    h+='<div class="card">';
    if(b.locked){
      h+='<div class="exhead"><h3 class="ex">'+b.nm+'<em>ждёт теста</em></h3></div>';
      h+='<div class="note">Сдай тест максимума в субботу первой недели цикла.</div></div>';
      return;
    }
    var done=0;
    b.sets.forEach(function(x,i){
      var v=marks[markKey(b.ex,i)];
      if(v!=null){ done++; reps+=v; }
    });
    totDone+=done; totAll+=b.sets.length;
    h+='<div class="exhead"><h3 class="ex">'+b.nm+'<em>'+b.modeName+'</em></h3>';
    h+='<div class="meta">'+b.sets.length+' подх. · макс '+b.M+
       (b.phase!==undefined && b.phase!==null ? ' · фаза '+b.phase : '')+'</div></div>';
    h+='<div class="sets">';
    var open = firstOpen(b, marks);
    b.sets.forEach(function(x,i){
      var v=marks[markKey(b.ex,i)], d=(v!=null);
      var nx=(i===open);
      h+='<button class="set'+(d?' done':'')+(nx?' active':'')+'" onclick="toggle(\''+b.ex+'\','+i+')">'+
         '<span class="lamp"></span><div class="n">'+(i+1)+'</div>'+
         '<div class="r'+(x.small&&!d?' sm':'')+'">'+(d?v:x.t)+'</div>'+
         '<div class="'+(x.amrap?'tag':'u')+'">'+(d?"сделано":(x.amrap?"≈"+x.est:""))+'</div></button>';
    });
    h+='</div><div class="note">'+b.tip+'</div></div>';
  });

  h+='<div class="card flat"><div class="stats">'+
     '<div class="stat"><div class="v">'+totDone+'/'+totAll+'</div><div class="l">Подходов</div></div>'+
     '<div class="stat"><div class="v">'+reps+'</div><div class="l">Повторений</div></div>'+
     '<div class="stat"><div class="v">'+(L.done?"✓":"—")+'</div><div class="l">Статус</div></div></div>';
  h+='<button class="btn" onclick="finish()" '+(totDone?'':'disabled')+'>'+
     (L.done?"Тренировка закрыта":"Завершить тренировку")+'</button>';
  h+='<button class="btn ghost sm" onclick="resetSess()">Сбросить отметки</button></div>';

  if(L.done){
    h+='<div class="card reward">';
    if(L.quote==null){
      h+='<div class="eyebrow">Награда</div><h2>Тренировка закрыта</h2>';
      h+='<div class="note">Сделанное сегодня уже никуда не денется.</div>';
      h+='<button class="btn" onclick="getQuote()">Получить цитату</button>';
    }else{
      var q=QUOTES[L.quote];
      h+='<div class="eyebrow">'+fmt(s.date)+'</div>';
      h+='<div class="quote">'+q[0]+'</div><div class="qa">'+q[1]+'</div>';
    }
    h+='</div>';
  }

  h+='<div class="rest" id="rest"><div class="row"><div class="lbl">Отдых</div>'+
     '<div class="t" id="rt">0:00</div></div><div class="bar"><i id="rb"></i></div>'+
     '<button class="btn ghost sm" onclick="stopRest()">Пропустить</button></div>';

  document.getElementById("v0").innerHTML=h;
  drawRest();
  if(restLeft()>0) runTick();
}
/* Первый неотмеченный подход блока — он и подсвечивается как текущий.
   Ровно один на блок: раньше при пустом блоке подсвечивались все сразу. */
function firstOpen(b, marks){
  var st=b.sets||[];
  for(var i=0;i<st.length;i++) if(marks[markKey(b.ex,i)]==null) return i;
  return -1;
}

function renderPlan(){
  var c=curCycle(), t=today(), h="";
  h+='<div class="card"><div class="eyebrow">Цикл '+(c+1)+'</div><h2>Четыре недели</h2>';
  h+='<div class="meta">сб · пн · ср — всегда все три упражнения</div>';
  h+='<div class="note">Порядок внутри тренировки не меняй: подтягивания первыми, пока свежий, приседания последними. Тяжёлые дни разнесены — в один день не сходится силовая работа на все три.</div></div>';

  for(var w=1;w<=CFG.cycleWeeks;w++){
    h+='<div class="wk"><h3><span>Неделя '+w+'</span>'+
       (w===CFG.cycleWeeks ? '<em>разгрузка</em>' : (w===1?'<em>тест</em>':''))+'</h3>';
    DAYS.forEach(function(d){
      var s=getSession(c,w,d.k), L=S.log[s.id];
      h+='<div class="sess'+(L&&L.done?' ok':'')+(s.date===t?' now':'')+'" onclick="openS(\''+s.id+'\')">';
      h+='<div class="top"><span class="d">'+fmt(s.date)+'</span><span class="nm">'+d.nm+'</span></div>';
      if(s.test){ h+='<div class="lines">тест всех трёх максимумов</div>'; }
      else{
        h+='<div class="lines">';
        s.blocks.forEach(function(b){
          if(b.locked){ h+=b.nm.toLowerCase()+" — ждёт теста<br>"; return; }
          var runs=[];
          b.sets.forEach(function(x){
            var key = x.amrap ? "макс" : x.t;
            if(runs.length && runs[runs.length-1].k===key) runs[runs.length-1].n++;
            else runs.push({k:key, n:1});
          });
          var txt=runs.map(function(rr){
            if(rr.n===1) return rr.k;
            return /^[0-9]+$/.test(rr.k) ? (rr.n+"×"+rr.k) : (rr.n+" подх. по "+rr.k);
          }).join(", ");
          h+=b.nm.toLowerCase()+" · "+String(MODE[b.mode]||b.modeName||"").toLowerCase()+": "+txt+"<br>";
        });
        h+='</div>';
      }
      h+='</div>';
    });
    h+='</div>';
  }
  h+='<div class="warn">Это полноценная программа на всё тело. Не добавляй её поверх другой — она её заменяет. Три тренировки в неделю, между ними день отдыха, и именно в дни отдыха растут мышцы.</div>';
  document.getElementById("v1").innerHTML=h;
}

/* Витрина знаков: полученные закрашены, следующий обведён, дальние серые.
   Смысл витрины не в полученных, а в том, что всегда видно следующую цель. */
function awardStrip(kind, e){
  var list = (kind==="vol") ? e.volume : e.records;
  var got=0, nextFound=false, cells="";
  list.forEach(function(n){
    var id=awardId(kind, e.key, n), d=S.awards[id], cls="aw";
    if(d){ cls+=" got"; got++; }
    else if(!nextFound){ cls+=" next"; nextFound=true; }
    cells+='<div class="'+cls+'" title="'+(d?("получено "+fmt(d)):(n+" — ещё не взято"))+'">'+
           shortN(n)+(d?'<span class="dt">'+fmt(d)+'</span>':'')+'</div>';
  });
  var h='<div class="awgrp"><div class="t">'+e.name+'<span>'+got+' / '+list.length+'</span></div>';
  h+='<div class="awrow" style="grid-template-columns:repeat('+list.length+',1fr)">'+cells+'</div></div>';
  return h;
}

    });

     '<b>Подтягивания</b> — самая долгая история. Первое чистое обычно приходит через 6–10 недель, десятка примерно через год, а 25 — это горизонт двух-трёх лет. Здесь важно не сравнивать темп с приседаниями, иначе будет казаться, что стоишь на месте.'+
     '</div></div>';

  h+='<div class="card"><div class="eyebrow">Про вес тела</div><div class="hint">'+
     'Подтягивания — единственное упражнение здесь, где каждый лишний килограмм прямо отнимает повторения. Если набор идёт медленно и мышцами, сила обгоняет вес. Если вес пошёл вверх быстрее 400–500 г в неделю, подтягивания встанут — и дело будет не в схеме.'+
     '</div></div>';

  h+='<div class="card"><div class="eyebrow">Уведомления</div>';

  document.getElementById("v2").innerHTML=h;
}

  h+='<div class="kc"><div class="v">'+c.bmr+'</div><div class="l">основной обмен</div></div>';
  h+='<div class="kc"><div class="v">'+c.prot+' г</div><div class="l">белок</div></div>';
  h+='<div class="kc"><div class="v">'+c.fat+' г</div><div class="l">жиры</div></div>';
  h+='<div class="kc big" style="background:var(--surface)"><div class="v" style="color:var(--ink);font-size:27.5px">'+c.carb+' г</div><div class="l">углеводы</div></div>';
  h+='</div>';
  h+='<div class="note">Это оценка, а не истина: формула ошибается на 10–15% в обе стороны. Настоящий ответ дают весы. Если через две недели вес стоит — прибавь 200 ккал. Если растёт быстрее '+c.weekGain+' кг в неделю, значит набирается лишний жир — убери 200.</div>';
  h+='</div>';

  h+='<div class="card"><div class="eyebrow">Про темп набора</div><div class="hint">'+
     'Цель — примерно <b>'+c.weekGain+' кг в неделю</b>, это около '+(c.weekGain*4).toFixed(1)+' кг в месяц. '+
     'Медленнее — не наберёшь, быстрее — наберёшь жиром. И помни про турник: каждый лишний килограмм тела прямо отнимает повторения в подтягиваниях, поэтому спешка тут работает против твоей первой цели.'+
     '</div></div>';

  var ks=Object.keys(b.w||{}).sort();
  if(ks.length>1){
    var vals=ks.map(function(k){ return b.w[k]; });
    var mn=Math.min.apply(null, vals), mx=Math.max.apply(null, vals), rng=Math.max(1, mx-mn);
    h+='<div class="card"><div class="eyebrow">Вес · '+ks.length+' записей</div><div class="chartwrap"><div class="chart">';
    ks.slice(-10).forEach(function(k){
      var v=b.w[k], pct=15+((v-mn)/rng)*85;
      h+='<div style="height:'+pct+'%"><span>'+v+'</span><i>'+fmt(k)+'</i></div>';
    });
    h+='</div></div></div>';
  }

  var st=moodStats(30);
  h+='<div class="card"><div class="eyebrow">Настроение за 30 дней</div>';
  if(st.n<3){
    h+='<div class="hint">Отмечено дней: '+st.n+'. Когда наберётся хотя бы неделя, здесь появится средняя и сравнение тренировочных дней с остальными.</div>';
  }else{
    h+='<div class="stats">'+
       '<div class="stat"><div class="v">'+st.all.toFixed(1)+'</div><div class="l">в среднем</div></div>'+
       '<div class="stat"><div class="v">'+(st.train!=null?st.train.toFixed(1):"—")+'</div><div class="l">в дни тренировок</div></div>'+
       '<div class="stat"><div class="v">'+(st.rest!=null?st.rest.toFixed(1):"—")+'</div><div class="l">в остальные</div></div></div>';
    h+='<div class="chartwrap" style="padding-top:6px"><div class="chart" style="height:70px;gap:2px">';
    moodDays(30).forEach(function(d){
      var m=S.mood[d];
      h+='<div style="height:'+(m?(m/5*100):2)+'%;background:'+(m?moodColor(m):"var(--line)")+'"></div>';
    });
    h+='</div></div>';
    h+='<div class="hint">Настроение падает раньше, чем падают цифры в подходах. Если несколько дней подряд на единице-двойке, а тренировки идут через силу — это не лень, это накопленная усталость: недосып, недоед или перебор объёма. Разгрузочная неделя существует ровно для этого.</div>';
  }
  h+='</div>';

  document.getElementById("v3").innerHTML=h;
}

var FSEL=null;   /* выбранный для просмотра день недели (0-6), null = сегодня */
function pickFoodDay(i){ FSEL=(FSEL===i ? null : i); render(); }

function macroBar(label, val, goal, unit){
  var pct=Math.max(0, Math.min(100, val/goal*100));
  var over = val>goal*1.08;
  return '<div class="prog"><div class="ttl">'+label+
    '<span>'+Math.round(val)+(unit||"")+' / '+Math.round(goal)+(unit||"")+'</span></div>'+
    '<div class="trk"><i style="width:'+pct+'%'+(over?';background:var(--red)':'')+'"></i></div></div>';
}

    h+='<div class="meta" style="margin-top:8px">Б '+mt.p.toFixed(0)+' · Ж '+mt.f.toFixed(0)+' · У '+mt.c.toFixed(0)+

  h+=macroBar("Клетчатка", tot.fib, FOOD_TARGET.fib, " г");
  h+='<div class="note">Норма посчитана по весу ~72 кг, росту 186 см и возрасту 32 года — как и калории на вкладке «Тело». Белок ~2,2 г на кг, жир ~1,4 г на кг, остальное углеводы. Цена — грубая прикидка по средним ценам, чтобы видеть порядок, а не точная сумма чека.</div>';
  h+='</div>';

  h+='<div class="card"><div class="eyebrow">Про объём еды</div><div class="hint">'+
     'Обычный человек съедает за день 1,5–2 кг еды. На наборе выходит больше, но всему есть предел: <b>3200 ккал одной картошкой с курицей — это почти 3 кг, столько не съесть.</b> Поэтому меню собрано плотным: масло в каше и в картошке, сметана в твороге, арахис, хлеб. Тот же приход калорий, но примерно на 700 г меньше по весу.<br><br>'+
     'По той же причине углеводов здесь ~390 г, а не 460, как пишут в схемах набора: недостающее добрано жиром, который вчетверо плотнее по объёму. Для трёх силовых в неделю 390 г с запасом хватает.<br><br>'+
     'Если какой-то приём всё равно не лезет — перенеси часть на следующий, день считается целиком, а не по часам.'+
     '</div></div>';

  h+='<div class="card"><div class="eyebrow">Как это готовится</div><div class="hint">'+
     'Будни — без разогрева: обед и оба перекуса собираются холодными и едутся с собой. Крупу и мясо на завтрашний обед готовишь вечером вместе с ужином, утром раскладываешь по контейнеру. Утренний перекус — бутерброды, их собрать минута.<br><br>'+
     '<b>Обед намеренно не самый большой приём пищи.</b> Холодный контейнер на килограмм не съедается — поэтому нагрузка размазана на три подхода за рабочий день, а не свалена в один обед.<br><br>'+
     'Молочного за день — по чуть-чуть в нескольких приёмах, ни разу не больше стакана зараз.<br><br>'+
     'Граммовки — ориентир, не аптечная точность. Крупы взаимозаменяемы один в один по сухому весу: рис, гречка, макароны. Овощи — любые свежие по сезону.'+
     '</div></div>';

  h+='<div class="card"><div class="eyebrow">Почему такие продукты</div><div class="hint">'+
     'Всё меню собрано из того, что лежит в любом обычном магазине и стоит недорого: курица, скумбрия, минтай, яйца, творог, сметана, крупы, картошка, хлеб, арахис. Дорогих позиций — миндаля, грецкого ореха, авокадо, оливкового масла, консервированного тунца, греческого йогурта, готовых хлебцев — здесь нет намеренно, они давали ту же пользу втрое дороже.<br><br>'+
     '<b>Скумбрия два раза в неделю</b> стоит отдельного слова. Это главный источник омега-3 в меню и единственный продукт здесь, который трудно заменить: минтай и курица этих жиров почти не содержат, а из растительных источников они усваиваются плохо. При этом скумбрия — одна из самых дешёвых рыб. Если совсем не пойдёт, ближайшая замена по смыслу — сельдь.<br><br>'+
     '<b>Железо.</b> Без красного мяса его дают куриное бедро (в нём железа заметно больше, чем в грудке), яйца, гречка и хлеб. Свежие овощи рядом с ними стоят не для объёма: витамин C заметно поднимает усвоение железа из этих источников.'+
     '</div></div>';

  document.getElementById("v4").innerHTML=h;
}


/* ═════════ 11. САМОПРОВЕРКА ═════════
   Прогоняет расчёты на выдуманном состоянии и возвращает список расхождений.
   Настоящие данные не трогает: подменяет S на время проверки и глушит запись. */

function selfTest(){
  var backup = JSON.stringify(S), errs = [], wasQuiet = QUIET;
  function ok(cond, msg){ if(!cond) errs.push(msg); }
  QUIET = true;
  try{
    /* 1. даты */
    ok(addD("2026-08-15",7)==="2026-08-22", "addD: неверный сдвиг даты");
    ok(daysBetween("2026-08-15","2026-08-22")===7, "daysBetween: неверная разница");
    ok(fmt("2026-08-22")==="22.08", "fmt: неверный формат даты");

    /* 2. генераторы плана не падают и дают осмысленные подходы */
    for(var M=0; M<=120; M+=6){
      for(var w=1; w<=CFG.cycleWeeks; w++){
        DAYS.forEach(function(d){
          EX.forEach(function(e){
            var p = PLANNERS[e.key]({mode:d.map[e.key], w:w, M:M, c:2, dl:(w===CFG.cycleWeeks)});
            ok(p && p.sets && p.sets.length>0, e.key+": пустой план при M="+M+", неделя "+w);
            ok(typeof p.rest==="number" && p.rest>0, e.key+": не задан отдых при M="+M);
            (p.sets||[]).forEach(function(x){
              ok(typeof x.v==="number" && x.v>=0 && isFinite(x.v),
                 e.key+": некорректное значение подхода при M="+M);
            });
          });
        });
      }
    }

    /* 3. подсчёт повторений: подводящие не должны попадать в счётчики */
    S = blank();
    S.cycles[0] = {pull:0, push:10, squat:20};
    var s = buildSession(0,2,"B");
    var L = logOf(s.id);
    freezePlan(s.id, s);
    L.plan.forEach(function(b){ (b.sets||[]).forEach(function(x,i){ L.marks[markKey(b.ex,i)] = x.v; }); });
    L.done = true; L.date = today();

    var R = exReps();
    ok(R.pull===0, "фаза 0: подтягивания не должны накапливаться, получено "+R.pull);
    var expect = {pull:0, push:0, squat:0};
    L.plan.forEach(function(b){
      if(!(b.ex in expect)) return;
      (b.sets||[]).forEach(function(x,i){ if(!x.aux) expect[b.ex]+=x.v; });
    });
    EX.forEach(function(e){
      ok(R[e.key]===expect[e.key],
         e.name+": счётчик "+R[e.key]+" не сходится с ожидаемым "+expect[e.key]);
    });

    /* 4. блок "extra" не должен попадать ни в один счётчик */
    var sA = buildSession(0,2,"A");
    ok(sA.blocks.filter(function(b){return b.ex==="extra";}).length===1,
       "суббота: пропал дополнительный блок");
    var LA = logOf(sA.id);
    freezePlan(sA.id, sA);
    LA.plan.forEach(function(b){ (b.sets||[]).forEach(function(x,i){ LA.marks[markKey(b.ex,i)]=x.v; }); });
    LA.done=true; LA.date=today();
    var R2 = exReps();
    ok(R2.pull>=R.pull && R2.push>=R.push && R2.squat>=R.squat, "счётчики не должны уменьшаться");

    /* 5. заморозка плана: изменение максимума не переписывает историю */
    var before = exReps();
    S.cycles[0].push = 60;
    var after = exReps();
    ok(before.push===after.push,
       "история сдвинулась при изменении максимума: было "+before.push+", стало "+after.push);

    /* 6. знаки: выдаются по порогу и не отзываются */
    S.awards = {};
    checkAwards(false);
    var pushEx = exBy("push");
    var crossed = pushEx.volume.filter(function(n){ return after.push>=n; });
    crossed.forEach(function(n){
      ok(!!S.awards[awardId("vol","push",n)], "не выдан знак за "+n+" отжиманий");
    });
    S.cycles[0] = {pull:12, push:10, squat:20};
    checkAwards(false);
    ok(!!S.awards[awardId("rec","pull",1)],  "не выдан знак за первое подтягивание");
    ok(!!S.awards[awardId("rec","pull",10)], "не выдан знак за рекорд 10 подтягиваний");
    delete S.log[s.id]; delete S.log[sA.id];
    checkAwards(false);
    ok(!!S.awards[awardId("rec","pull",1)], "знак отозвался после сброса тренировки");

    /* 7. тоннаж */
    S.body.w = {}; S.body.w[today()] = 80;
    var t = tonnage("pull", 100);
    ok(Math.abs(t - 100*1.00*80) < 0.01, "тоннаж подтягиваний посчитан неверно");
    ok(fmtMass(8000)==="8.0 т", "форматирование массы: "+fmtMass(8000));
    ok(fmtMass(640)==="640 кг",  "форматирование массы: "+fmtMass(640));

    /* 8. склонение */
    ok(repWord("push",1)==="отжимание",   "склонение: 1");
    ok(repWord("push",2)==="отжимания",   "склонение: 2");
    ok(repWord("push",5)==="отжиманий",   "склонение: 5");
    ok(repWord("push",11)==="отжиманий",  "склонение: 11");
    ok(repWord("push",21)==="отжимание",  "склонение: 21");

    /* 9. горизонт планирования растёт вместе с датой старта */
    S.start = addD(today(), -700);
    ok(horizonCycles() >= 25+CFG.aheadCycles-1, "горизонт не растёт: "+horizonCycles());
    ok(allSessions().length > 0, "календарь пуст");

    /* 10. меню: на каждый день недели есть план, все продукты существуют в базе,
       дневной итог в разумных пределах вокруг цели (не переписанная вручную цифра —
       пересчитывается из FOOD_DB, поэтому и проверяем сумму, а не факт её наличия) */
    for(var dow=0; dow<7; dow++){
      var dm = MEALS_BY_DAY[dow];
      ok(!!dm && dm.meals && dm.meals.length>0, "нет меню на день недели "+dow);
      if(!dm) continue;
      dm.meals.forEach(function(meal){
        (meal.items||[]).forEach(function(it){
          ok(!!FOOD_DB[it[0]], "меню '"+dm.label+"' ссылается на несуществующий продукт: "+it[0]);
          ok(it[1]>0, "меню '"+dm.label+"': нулевая или отрицательная порция у "+it[0]);
        });
      });
      var t = dayTotals(dm.meals);
      ok(t.kcal > FOOD_TARGET.kcal*0.94 && t.kcal < FOOD_TARGET.kcal*1.06,
         dm.label+": дневной итог "+Math.round(t.kcal)+" ккал далеко от цели "+FOOD_TARGET.kcal);
      ok(t.p >= FOOD_TARGET.prot*0.9 && t.p <= FOOD_TARGET.prot*1.15,
         dm.label+": белка "+Math.round(t.p)+"г вне разумного коридора");
      ok(t.f >= FOOD_TARGET.fat*0.85 && t.f <= FOOD_TARGET.fat*1.2,
         dm.label+": жира "+Math.round(t.f)+"г вне разумного коридора");
      ok(t.c >= FOOD_TARGET.carb*0.88,
         dm.label+": углеводов всего "+Math.round(t.c)+"г — мало для набора");
      ok(t.fib >= 30 && t.fib <= 58,
         dm.label+": клетчатки "+Math.round(t.fib)+"г вне разумного коридора");

      /* ОБЪЁМ. Главная проверка этого раздела: посчитать калории легко,
         а вот съесть их — нет. Держим день в пределах съедобного. */
      ok(t.mass <= FOOD_LIMITS.dayMass,
         dm.label+": за день "+Math.round(t.mass)+" г еды — столько не съесть (потолок "+FOOD_LIMITS.dayMass+")");
      ok(t.kcal/t.mass*100 >= 125,
         dm.label+": плотность "+Math.round(t.kcal/t.mass*100)+" ккал/100 г — еда слишком объёмная");

      /* обед в будни должен оставаться подъёмным холодным контейнером */
      if(dow>=1 && dow<=5){
        var lunch = dm.meals.filter(function(x){ return x.label==="Обед"; })[0];
        ok(!!lunch, dm.label+": не найден обед");
        if(lunch){
          var lt = mealTotals(lunch.items);
          ok(lt.mass <= FOOD_LIMITS.coldLunchMass,
             dm.label+": холодный обед "+Math.round(lt.mass)+" г — не влезет в контейнер (потолок "+FOOD_LIMITS.coldLunchMass+")");
        }
      }
      /* ни один приём пищи не должен быть неподъёмным */
      dm.meals.forEach(function(meal){
        var mm = mealTotals(meal.items);
        ok(mm.mass <= 700, dm.label+", "+meal.label+": "+Math.round(mm.mass)+" г за один присест — многовато");
      });
      /* молочного не больше стакана за один приём пищи */
      var MILKY = {молоко:1, кефир:1};
      dm.meals.forEach(function(meal){
        var ml=0;
        (meal.items||[]).forEach(function(it){ if(MILKY[it[0]]) ml+=it[1]; });
        ok(ml<=220, dm.label+", "+meal.label+": молочного "+ml+" г за раз — больше стакана");
      });
    }
    /* исключённые продукты не должны вернуться в меню незаметно */
    var BANNED = ["индейка","говядина_вырезка","говяжий_фарш","лосось","чечевица","нут",
                  "тунец","треска","йогурт_греч","миндаль","грецкий_орех","авокадо",
                  "оливковое_масло","хлебцы"];
    BANNED.forEach(function(k){ ok(!FOOD_DB[k], "убранный продукт снова в базе: "+k); });
    ok(!!FOOD_DB.скумбрия, "скумбрия пропала из базы");
    /* жирная рыба должна быть минимум дважды в неделю — это весь омега-3 в меню */
    var oily=0;
    for(var d2=0; d2<7; d2++){
      (MEALS_BY_DAY[d2].meals||[]).forEach(function(meal){
        (meal.items||[]).forEach(function(it){ if(it[0]==="скумбрия") oily++; });
      });
    }
    ok(oily>=2, "жирная рыба всего "+oily+" раз в неделю — мало для омега-3");
    /* пересчёт из базы не расходится с суммой по отдельным приёмам пищи */
    var mondayMeals = MEALS_BY_DAY[1].meals;
    var sumByHand = mondayMeals.reduce(function(acc,meal){
      var mt=mealTotals(meal.items); return acc+mt.kcal;
    }, 0);
    ok(Math.abs(sumByHand - dayTotals(mondayMeals).kcal) < 0.01,
       "dayTotals расходится с суммой mealTotals");

  }catch(e){
    errs.push("Исключение: "+(e && e.message ? e.message : String(e)));
  }finally{
    S = JSON.parse(backup);
    QUIET = wasQuiet;
    save();
  }
  return errs;
}
function runSelfTest(){
  var errs = selfTest();
  if(!errs.length){ alert("Проверка пройдена. Расчёты сходятся."); return; }
  alert("Найдены расхождения ("+errs.length+"):\n\n• "+errs.slice(0,12).join("\n• ")+
        (errs.length>12 ? "\n\n…и ещё "+(errs.length-12) : ""));
}


/* ═════════ 12. СТАРТ ═════════ */

bootState();
/* Первый запуск новой версии: выдаём знаки за уже взятые пороги молча,
   чтобы не вываливать на человека стену карточек. */
if(!S.awardsInit){ checkAwards(false); S.awardsInit = true; save(); }
render();
if(restLeft()>0) runTick();

/* После пробуждения экрана таймер мог сильно отстать — перерисовываем сразу. */
document.addEventListener("visibilitychange", function(){
  if(!document.hidden){ drawRest(); if(restLeft()>0) runTick(); }
});

/* офлайн-режим */
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js").catch(function(){});
  });
}
