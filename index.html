<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#DDE0D8">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Три упражнения</title>
<style>
:root{
  --panel:#DDE0D8; --surface:#F6F7F3; --ink:#171A16; --muted:#6C7167;
  --line:#C2C7BB; --amber:#C97C00; --green:#2F7A4F; --red:#A33B2A; --blue:#3A5C7A;
  --mono: ui-monospace,"SF Mono","Roboto Mono","DejaVu Sans Mono",monospace;
  --sans: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--panel);color:var(--ink);font-family:var(--sans);
  font-size:17px;line-height:1.5;padding:0 0 env(safe-area-inset-bottom);
  -webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 40px}

header{padding:calc(12px + env(safe-area-inset-top)) 0 10px;border-bottom:2px solid var(--ink)}
.brand{font-weight:800;font-size:13px;letter-spacing:.18em;text-transform:uppercase}
.brand span{font-weight:500;color:var(--muted);letter-spacing:.1em}
.maxrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.mx{background:var(--surface);border:1px solid var(--line);padding:7px 4px;text-align:center}
.mx .l{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mx .v{font-family:var(--mono);font-size:27px;font-weight:700;line-height:1.1}
.mx .g{font-size:10.5px;color:var(--muted);font-family:var(--mono)}

nav{display:flex;border-bottom:1px solid var(--line);margin-bottom:14px}
nav button{flex:1;background:none;border:none;border-bottom:3px solid transparent;
  padding:12px 4px;font-family:var(--sans);font-size:12.5px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muted);cursor:pointer}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--amber)}

.card{background:var(--surface);border:1px solid var(--line);padding:14px;margin-bottom:12px}
.card.flat{background:none;border:none;padding:0}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
h2{font-size:20px;font-weight:800;margin:0 0 2px;letter-spacing:-.01em}
h3.ex{font-size:17px;font-weight:800;margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h3.ex em{font-style:normal;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--amber);font-weight:700;flex-shrink:0}
.meta{font-size:13.5px;color:var(--muted);font-family:var(--mono)}
.note{font-size:14px;color:var(--muted);margin-top:9px;line-height:1.5}
.exhead{border-left:3px solid var(--ink);padding-left:9px;margin-bottom:2px}

.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(94px,1fr));gap:8px;margin-top:11px}
.set{position:relative;background:var(--panel);border:1px solid var(--line);
  padding:14px 6px 12px;text-align:center;cursor:pointer;font-family:var(--mono);
  transition:background .12s,border-color .12s}
.set .lamp{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;
  background:var(--line);border:1px solid rgba(0,0,0,.18)}
.set .n{font-size:10px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;
  font-family:var(--sans);font-weight:700}
.set .r{font-size:27px;font-weight:700;line-height:1.15;letter-spacing:-.02em}
.set .r.sm{font-size:16px;line-height:1.25;padding-top:3px}
.set .u{font-size:10.5px;color:var(--muted)}
.set.done{background:#E6EDE7;border-color:var(--green)}
.set.done .lamp{background:var(--green);box-shadow:0 0 7px rgba(47,122,79,.6)}
.set.done .r{color:var(--green)}
.set.active{border-color:var(--amber);background:#F5EBDA}
.set.active .lamp{background:var(--amber);box-shadow:0 0 7px rgba(201,124,0,.7)}
.set .tag{font-size:10px;letter-spacing:.08em;color:var(--amber);font-weight:700;font-family:var(--sans)}

.rest{position:sticky;bottom:0;margin-top:12px;border:1px solid var(--amber);
  background:#F5EBDA;padding:10px 12px;display:none;z-index:5}
.rest.on{display:block}
.rest .row{display:flex;justify-content:space-between;align-items:baseline}
.rest .t{font-family:var(--mono);font-size:32px;font-weight:700;line-height:1}
.rest .lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.bar{height:4px;background:var(--line);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--amber);transition:width .95s linear}

button.btn{display:block;width:100%;padding:13px;background:var(--ink);color:var(--surface);
  border:none;font-family:var(--sans);font-size:13px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;cursor:pointer;margin-top:10px}
button.btn.ghost{background:none;color:var(--ink);border:1px solid var(--ink)}
button.btn.sm{padding:10px;font-size:11.5px;margin-top:7px}
button.btn:disabled{opacity:.35}

.tin{display:flex;align-items:center;gap:10px;margin-top:9px}
.tin label{flex:1;font-size:15px;font-weight:700}
.tin input{width:104px;padding:12px;font-family:var(--mono);font-size:24px;font-weight:700;
  text-align:center;border:1px solid var(--ink);background:var(--surface);color:var(--ink)}

.wk{margin-bottom:16px}
.wk h3{font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 6px;
  padding-bottom:4px;border-bottom:1px solid var(--line);color:var(--muted);
  display:flex;justify-content:space-between}
.wk h3 em{font-style:normal;color:var(--amber);font-weight:700}
.sess{padding:8px 0;border-bottom:1px dotted var(--line);cursor:pointer}
.sess:last-child{border-bottom:none}
.sess .top{display:flex;gap:8px;align-items:baseline;font-size:14.5px}
.sess .d{font-family:var(--mono);font-size:13px;color:var(--muted);width:54px;flex-shrink:0}
.sess .nm{font-weight:700;flex:1}
.sess .lines{font-family:var(--mono);font-size:12.5px;color:var(--muted);
  margin:4px 0 0 62px;line-height:1.6}
.sess.ok .nm{color:var(--green)}
.sess.ok .d::after{content:" ✓";color:var(--green)}
.sess.now{background:#F5EBDA;margin:0 -8px;padding:8px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.stat{background:var(--surface);padding:10px 6px;text-align:center}
.stat .v{font-family:var(--mono);font-size:24px;font-weight:700;line-height:1.1}
.stat .l{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.prog{margin-top:14px}
.prog .ttl{font-size:13.5px;font-weight:700;display:flex;justify-content:space-between;margin-bottom:4px}
.prog .ttl span{font-family:var(--mono);color:var(--muted);font-weight:400;font-size:12.5px}
.trk{height:9px;background:var(--line);position:relative;overflow:hidden}
.trk i{display:block;height:100%;background:var(--amber)}
.chart{display:flex;align-items:flex-end;gap:5px;height:96px;margin-top:14px;border-bottom:1px solid var(--ink)}
.chart div{flex:1;background:var(--amber);position:relative;min-height:2px}
.chart div span{position:absolute;top:-16px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:10px;font-weight:700}
.chart div i{position:absolute;bottom:-16px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:9px;color:var(--muted);font-style:normal}
.chartwrap{padding:18px 0 20px}
.mstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.mday{background:var(--panel);border:1px solid var(--line);padding:7px 2px;text-align:center;cursor:pointer}
.mday.sel{border-color:var(--ink);border-width:2px;padding:6px 1px}
.mday .dw{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.mday .dn{font-family:var(--mono);font-size:13px;font-weight:700;line-height:1.3}
.mday .dot{width:9px;height:9px;border-radius:50%;margin:4px auto 0;background:var(--line)}
.mbtns{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:9px}
.mbtn{background:var(--panel);border:1px solid var(--line);padding:9px 2px;text-align:center;
  cursor:pointer;font-size:10px;font-weight:700;letter-spacing:.02em;line-height:1.25}
.mbtn b{display:block;font-family:var(--mono);font-size:17px;margin-bottom:2px}
.mbtn.on{border-color:var(--ink);border-width:2px;padding:8px 1px}
.frow{display:flex;align-items:center;gap:9px;margin-top:8px}
.frow label{flex:1;font-size:14px}
.frow input,.frow select{width:112px;padding:10px;font-family:var(--mono);font-size:17px;
  font-weight:700;text-align:center;border:1px solid var(--ink);background:var(--surface);color:var(--ink)}
.frow select{font-size:13px;text-align:left}
.kcal{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);margin-top:12px}
.kc{background:var(--surface);padding:12px 8px;text-align:center}
.kc.big{grid-column:1/-1;background:#F5EBDA}
.kc .v{font-family:var(--mono);font-size:25px;font-weight:700;line-height:1.1}
.kc.big .v{font-size:33px;color:var(--amber)}
.kc .l{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.reward{border-color:var(--amber);background:#F5EBDA}
.quote{font-size:19px;line-height:1.45;font-weight:600;letter-spacing:-.01em;margin:10px 0 8px}
.qa{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.hint{font-size:13.5px;color:var(--muted);line-height:1.55;margin-top:12px}
.hint b{color:var(--ink)}
.warn{border-left:3px solid var(--amber);padding-left:10px;margin-top:10px;font-size:14px;line-height:1.5;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="brand">Три упражнения <span id="hCyc"></span></div>
  <div class="maxrow">
    <div class="mx"><div class="l">Подтяг.</div><div class="v" id="mPull">—</div><div class="g">цель 25</div></div>
    <div class="mx"><div class="l">Отжим.</div><div class="v" id="mPush">—</div><div class="g">цель 100</div></div>
    <div class="mx"><div class="l">Присед.</div><div class="v" id="mSquat">—</div><div class="g">цель 100</div></div>
  </div>
</header>

<nav role="tablist">
  <button role="tab" id="t0" aria-selected="true" onclick="tab(0)">Сегодня</button>
  <button role="tab" id="t1" aria-selected="false" onclick="tab(1)">План</button>
  <button role="tab" id="t2" aria-selected="false" onclick="tab(2)">Прогресс</button>
  <button role="tab" id="t3" aria-selected="false" onclick="tab(3)">Тело</button>
</nav>

<section id="v0"></section>
<section id="v1" hidden></section>
<section id="v2" hidden></section>
<section id="v3" hidden></section>
</div>

<script>
"use strict";
var KEY="trener3", mem=null;

/* ═════════ хранилище ═════════ */
function loadS(){ try{var r=localStorage.getItem(KEY); if(r) return JSON.parse(r);}catch(e){} return mem; }
function save(){ mem=S; try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }

/* перенос данных из старой версии (только отжимания) */
function migrate(){
  try{
    var old=localStorage.getItem("pushups100"); if(!old) return null;
    var o=JSON.parse(old), n={start:o.start||"2026-08-15",cycles:[],log:{},view:null};
    (o.cycles||[]).forEach(function(c){ n.cycles.push({push:c.m,pull:null,squat:null,date:c.date}); });
    for(var k in (o.log||{})){ n.log[k]={push:o.log[k].sets||[],pull:[],squat:[],done:false}; }
    return n;
  }catch(e){ return null; }
}

var START="2026-08-15";
var S = loadS() || migrate() || {start:START,cycles:[{push:10,pull:null,squat:null}],log:{},view:null};
if(!S.cycles.length) S.cycles=[{push:10,pull:null,squat:null}];
if(!S.mood) S.mood={};
if(!S.body) S.body={h:null, age:32, act:1.725, w:{}};
save();

var EX=[
  {k:"pull", nm:"Подтягивания", goal:25},
  {k:"push", nm:"Отжимания",    goal:100},
  {k:"squat",nm:"Приседания",   goal:100}
];
/* распределение режимов: A=сила, B=объём, C=техника */
var DAYS=[
  {k:"A", nm:"Суббота", off:0, map:{pull:"A", push:"A", squat:"B"}},
  {k:"B", nm:"Понедельник", off:2, map:{pull:"C", push:"B", squat:"A"}},
  {k:"C", nm:"Среда", off:4, map:{pull:"B", push:"C", squat:"C"}}
];
var MODE={A:"Сила",B:"Объём",C:"Техника"};

/* ═════════ даты ═════════ */
function d2s(d){return d.toISOString().slice(0,10);}
function s2d(s){var p=s.split("-");return new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));}
function addD(s,n){var d=s2d(s);d.setUTCDate(d.getUTCDate()+n);return d2s(d);}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function fmt(s){var p=s.split("-");return p[2]+"."+p[1];}

function sid(c,w,k){return c+"-"+w+"-"+k;}
function sdate(c,w,k){
  var sat=addD(S.start,(c*4+(w-1))*7);
  return addD(sat, DAYS.filter(function(d){return d.k===k;})[0].off);
}
function mOf(c,ex){ return S.cycles[c] && S.cycles[c][ex]!=null ? S.cycles[c][ex] : null; }
function curCycle(){
  var t=today();
  for(var c=S.cycles.length-1;c>=0;c--) if(sdate(c,1,"A")<=t) return c;
  return 0;
}

/* ═════════ конструктор подхода ═════════ */
function P(text,val,o){ var s={t:text,v:val}; if(o) for(var k in o) s[k]=o[k]; return s; }
function pick(w,arr){ return arr[w-1]; }

/* ═════════ ОТЖИМАНИЯ ═════════ */
function planPush(w,M){
  var m=DAYS_MODE.push, dl=(w===4), bump=dl?0:(w-1);
  if(m==="A"){
    var s=[0.6,0.7,0.6,0.5].map(function(f){
      return P(String(Math.max(1,Math.round(M*f*(dl?0.6:1))+bump)), Math.max(1,Math.round(M*f*(dl?0.6:1))+bump));
    });
    if(!dl) s.push(P("МАКС", M+Math.max(0,w-2), {amrap:true,est:M+Math.max(0,w-2),small:true}));
    return {mode:"A",sets:s,rest:170,
      tip: dl?"Разгрузка. Легко, без максимума."
           :(M>40?"Максимум больше 40 — ставь ноги на возвышение 40–50 см или надевай рюкзак 5–10 кг, подходы по 8–12."
                 :"Отдых 2,5–3 мин. В последнем подходе оставь 1–2 повторения в запасе.")};
  }
  if(m==="B"){
    var base = M<=20?10 : (M<=40?8:7);
    var n=dl?6:(base+(w-1)), r=Math.max(1,Math.round(M*0.4)), a=[];
    for(var i=0;i<n;i++) a.push(P(String(r),r));
    return {mode:"B",sets:a,rest:75,tip:"Отдых 60–90 сек. Здесь не тяжело — здесь много."};
  }
  var n2=dl?3:5, r2=Math.max(1,Math.round(M*0.4)), b=[];
  for(var j=0;j<n2;j++) b.push(P(String(r2),r2));
  var v=["узкая постановка рук","широкая постановка рук","ноги на возвышении 20–30 см","пауза 2 сек внизу"][w-1];
  return {mode:"C",sets:b,rest:120,tip:"3 сек вниз, пауза грудью у пола, вверх мощно. Вариант недели — "+v+"."};
}

/* ═════════ ПОДТЯГИВАНИЯ ═════════ */
function planPull(w,M){
  var m=DAYS_MODE.pull, dl=(w===4), a=[], i;

  /* ФАЗА 0 — пока нет ни одного подтягивания */
  if(M===0){
    if(m==="A"){
      var n=pick(w,[4,5,5,3]), r=pick(w,[3,3,4,3]), sec=pick(w,[5,5,6,5]);
      for(i=0;i<n;i++) a.push(P(r+" × "+sec+" сек",r,{small:true}));
      return {mode:"A",phase:0,sets:a,rest:150,
        tip:"Негативы. Подставь табурет, выйди в верхнюю точку, убери ноги и опускайся ровно "+sec+" секунд, считая вслух. Не падай в конце — контролируй до самого низа."};
    }
    if(m==="B"){
      var n2=pick(w,[5,5,6,4]), r2=pick(w,[6,8,10,6]);
      for(i=0;i<n2;i++) a.push(P(String(r2),r2));
      return {mode:"B",phase:0,sets:a,rest:90,
        tip:"Австралийские подтягивания: перекладина на уровне пояса, ноги на земле, тело прямое, тянешь грудь к перекладине. Чем ближе ноги к перекладине — тем легче."};
    }
    var n3=pick(w,[3,3,4,3]), r3=pick(w,[8,9,10,6]);
    for(i=0;i<n3;i++) a.push(P(r3+" лопат.",r3,{small:true}));
    for(i=0;i<3;i++) a.push(P("вис 25 сек",0,{small:true}));
    return {mode:"C",phase:0,sets:a,rest:75,
      tip:"Лопаточные подтягивания: висишь на прямых руках и тянешь плечи вниз от ушей, руки не сгибаются. Это учит включать спину — без этого подтягивание не появится. Потом просто вис на хват."};
  }

  /* ФАЗА 1 — от 1 до 4 подтягиваний */
  if(M<5){
    if(m==="A"){
      var n4=pick(w,[4,5,6,3]);
      for(i=0;i<n4;i++) a.push(P(String(M),M));
      return {mode:"A",phase:1,sets:a,rest:180,
        tip:"Много коротких подходов — так строится первое чистое подтягивание. Отдых 3 мин, каждый подход свежий. Ни одного грязного повторения с рывком."};
    }
    if(m==="B"){
      var n5=pick(w,[8,9,10,6]), r5=Math.max(1,M-1);
      for(i=0;i<n5;i++) a.push(P(String(r5),r5));
      return {mode:"B",phase:1,sets:a,rest:90,tip:"Отдых 90 сек. Никогда не до отказа — как только чувствуешь, что следующее будет рывком, подход закончен."};
    }
    for(i=0;i<4;i++) a.push(P("12 австр.",12,{small:true}));
    for(i=0;i<3;i++) a.push(P("8 лопат.",8,{small:true}));
    return {mode:"C",phase:1,sets:a,rest:75,tip:"Австралийские + лопаточные. Лёгкий день, он держит объём спины без нагрузки на локти."};
  }

  /* ФАЗА 2 — процентная схема */
  var bump=dl?0:(w-1);
  if(m==="A"){
    [0.6,0.7,0.6,0.5].forEach(function(f){
      var r=Math.max(1,Math.round(M*f*(dl?0.6:1))+bump); a.push(P(String(r),r));
    });
    if(!dl) a.push(P("МАКС",M+Math.max(0,w-2),{amrap:true,est:M+Math.max(0,w-2),small:true}));
    return {mode:"A",phase:2,sets:a,rest:180,
      tip: dl?"Разгрузка.":"Отдых 3 мин. В последнем подходе оставь одно повторение в запасе. "+(M>12?"Максимум выше 12 — добавь рюкзак 5 кг и работай по 5–8.":"")};
  }
  if(m==="B"){
    var b6 = M<=8?8 : (M<=15?6:5);
    var n6=dl?5:(b6+(w-1)), r6=Math.max(1,Math.round(M*(M>15?0.35:0.4)));
    for(i=0;i<n6;i++) a.push(P(String(r6),r6));
    return {mode:"B",phase:2,sets:a,rest:100,tip:"Отдых 90–120 сек. Объём строит подтягивания лучше, чем работа до отказа."};
  }
  var n7=dl?3:4, r7=Math.max(1,Math.round(M*0.4));
  for(i=0;i<n7;i++) a.push(P(String(r7),r7,{small:false}));
  a.push(P("12 австр.",12,{small:true}));
  return {mode:"C",phase:2,sets:a,rest:90,tip:"3 секунды вниз, пауза внизу на прямых руках. Медленное опускание — то, что делает хват и спину крепкими."};
}

/* ═════════ ПРИСЕДАНИЯ ═════════ */
function planSquat(w,M,c){
  var m=DAYS_MODE.squat, dl=(w===4), a=[], i;
  if(m==="A"){
    var step=Math.min(c||0,4);
    var n  = dl?3:4;
    var r  = dl ? Math.max(5,Math.min(12,Math.round(M*0.3)))
                : Math.max(6,Math.min(15,Math.round(M*0.35)+(w-1)));
    var capped = (!dl && Math.round(M*0.35)+(w-1) > 15);
    for(i=0;i<n;i++) a.push(P(r+" темп",r,{small:true}));

    var nb = dl?2:3;
    var rb = dl ? 10 : Math.min(25, 12 + 2*(w-1) + 2*step);
    for(i=0;i<nb;i++) a.push(P(rb+" мост",rb,{small:true}));

    var ns = 2;
    var sc = dl ? 25 : Math.min(60, 30 + 5*(w-1) + 5*step);
    for(i=0;i<ns;i++) a.push(P(sc+" сек",0,{small:true}));

    var extra = capped ? " Повторения дошли до потолка — дальше усложняй только весом: рюкзак 5–8 кг, потом 10–12. Глубину и количество не увеличивай."
              : step>=3 ? " Ты уже несколько циклов на этом — надень рюкзак 5–8 кг, но глубину не увеличивай."
              : step>=1 ? " Мостик делай с ногами на возвышении 20 см — так ягодицы включаются сильнее."
              : "";
    return {mode:"A",sets:a,rest:90,
      tip:"Три упражнения подряд. <b>Темповые приседания</b> — 4 секунды вниз, 2 секунды пауза, вверх мощно; вес держи на всей стопе, колени разводи наружу по линии носков. <b>Ягодичный мостик</b> — лёжа на спине, поднимаешь таз, колени не нагружаются вообще; слабые колени почти всегда идут в паре со слабыми ягодицами, поэтому это здесь не для галочки. <b>Стульчик у стены</b> — спина к стене, бёдра параллельно полу, держишь время; статика укрепляет сухожилия колена без движения в суставе."+extra};
  }
  if(m==="B"){
    var n2 = dl ? (M>40?3:4) : (M>40?5:7);
    var r2 = dl ? Math.max(5,Math.round(M*0.45))
                : Math.max(5,Math.round(M*(0.50+0.07*(w-1))));
    for(i=0;i<n2;i++) a.push(P(String(r2),r2));
    if(!dl) a.push(P("МАКС",M+(w-1)*2,{amrap:true,est:M+(w-1)*2,small:true}));
    return {mode:"B",sets:a,rest:75,
      tip:"Отдых 60–90 сек. Последний подход — на максимум, именно он двигает цифру к сотне. Дыши: вдох вниз, выдох вверх, не задерживай. <b>Про колени:</b> жжение в мышцах — норма, тянущая или острая боль в самом колене — нет. Если колени отзываются, приседай до чуть выше параллели и держи эту глубину пару циклов, объём при этом не снижай."};
  }
  var n3=dl?3:4, r3=Math.max(4,Math.round(M*0.45)), b=[];
  for(i=0;i<n3;i++) b.push(P(String(r3),r3));
  return {mode:"C",sets:b,rest:90,
    tip:"Темп: 3 сек вниз, пауза 2 сек внизу, вверх мощно. Пятки не отрываются, колени разводи наружу — сведённые внутрь колени и есть главная причина, по которой они болят. Если пятки отрываются, подложи под них книгу: это не костыль, а способ приседать глубже без перегрузки колена, пока голеностоп не станет подвижнее."};
}

/* ═════════ сборка сессии ═════════ */
var DAYS_MODE={};
/* ═════════ ДОПОЛНИТЕЛЬНЫЙ БЛОК ═════════
   Суббота — корпус. Среда — задняя поверхность бедра и боковая устойчивость.
   Понедельник не трогаем: самый загруженный будний день.            */
function planExtra(w,k,c){
  var dl=(w===4), step=Math.min(c||0,4), a=[], i;

  if(k==="A"){
    var n=dl?2:3;
    var sec=dl?15:Math.min(60, 20+5*(w-1)+5*step);
    for(i=0;i<n;i++) a.push(P(sec+" сек",0,{small:true}));
    return {ex:"extra", nm:"Корпус", modeName:"Полая позиция"+(dl?" · разгрузка":""),
      sets:a, rest:75, M:"\u2014",
      tip:"Лёжа на спине: поясница прижата к полу, лопатки и ноги оторваны от пола, руки вдоль тела. Если поясница отрывается — согни колени, так легче. Это не пресс ради пресса: без жёсткого корпуса таз провисает в отжиманиях и раскачивается на турнике."};
  }

  var nh=dl?2:3, rh=dl?5:(6+2*(w-1)+step);
  for(i=0;i<nh;i++) a.push(P(rh+" сгиб",rh,{small:true}));
  var sp=dl?15:Math.min(45, 20+5*(w-1)+5*step);
  for(i=0;i<2;i++) a.push(P(sp+" сек",0,{small:true}));

  return {ex:"extra", nm:"Задняя поверхность и бок", modeName:"Бицепс бедра"+(dl?" · разгрузка":""),
    sets:a, rest:75, M:"\u2014",
    tip:"<b>Сгибание ног со скольжением</b> — лёжа на спине, пятки на полотенце на гладком полу, поднимаешь таз и медленно выпрямляешь ноги, потом подтягиваешь пятки обратно, таз при этом не опускаешь. Это то, чего в программе не хватало: колено держится балансом квадрицепса и бицепса бедра, а тренировался у нас только первый. <b>Боковая планка</b> — на предплечье, тело в линию, время указано на каждую сторону; она укрепляет среднюю ягодичную, из-за слабости которой колено и заваливается внутрь."};
}

function session(c,w,k){
  var day=DAYS.filter(function(d){return d.k===k;})[0];
  var out={id:sid(c,w,k),c:c,w:w,k:k,date:sdate(c,w,k),dayName:day.nm,blocks:[]};
  if(w===1 && k==="A"){ out.test=true; return out; }
  EX.forEach(function(e){
    var M=mOf(c,e.k);
    if(M===null){ out.blocks.push({ex:e.k,nm:e.nm,locked:true}); return; }
    DAYS_MODE=day.map;
    var p = e.k==="push"?planPush(w,M) : e.k==="pull"?planPull(w,M) : planSquat(w,M,c);
    p.ex=e.k; p.nm=e.nm; p.M=M;
    p.modeName=MODE[day.map[e.k]] + (w===4?" · разгрузка":"");
    out.blocks.push(p);
  });
  if((k==="A"||k==="C") && mOf(c,"squat")!==null) out.blocks.push(planExtra(w,k,c));
  return out;
}
function allSessions(nc){
  var out=[];
  for(var c=0;c<(nc||9);c++) for(var w=1;w<=4;w++) DAYS.forEach(function(d){
    out.push({c:c,w:w,k:d.k,id:sid(c,w,d.k),date:sdate(c,w,d.k),dayName:d.nm});
  });
  return out.sort(function(a,b){return a.date<b.date?-1:1;});
}
function currentRef(){
  if(S.view){ var f=allSessions(9).filter(function(s){return s.id===S.view;}); if(f[0]) return f[0]; }
  var t=today(), all=allSessions(9);
  var ex=all.filter(function(s){return s.date===t;})[0]; if(ex) return ex;
  return all.filter(function(s){return s.date>=t && !(S.log[s.id]&&S.log[s.id].done);})[0] || all[0];
}

function beep(){
  try{var C=window.AudioContext||window.webkitAudioContext; if(C){
    var x=new C(),o=x.createOscillator(),g=x.createGain();
    o.connect(g);g.connect(x.destination);o.type="square";o.frequency.value=880;
    g.gain.setValueAtTime(.12,x.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,x.currentTime+.4);
    o.start();o.stop(x.currentTime+.42);}}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([120,80,120]);}catch(e){}
}
var tick=null,left=0,full=0;
function startRest(sec){stopRest();left=sec;full=sec;drawRest();
  tick=setInterval(function(){left--;drawRest();if(left<=0){stopRest();beep();notify("Отдых окончен","Следующий подход.");}},1000);}

/* ═════════ ТЕЛО И КАЛОРИИ ═════════
   Формула Миффлина–Сан Жеора — сейчас основная в диетологии.
   Даёт оценку, а не истину: реальная поправка приходит от весов. */
function lastWeight(){
  var ks=Object.keys(S.body.w||{}).sort();
  return ks.length ? S.body.w[ks[ks.length-1]] : null;
}
function setBody(field, val){
  var v=parseFloat(String(val).replace(",","."));
  if(field==="w"){
    if(isNaN(v)||v<30||v>250) return;
    S.body.w[today()]=Math.round(v*10)/10;
  } else {
    if(isNaN(v)) return;
    S.body[field]=v;
  }
  save(); render();
}
function calc(){
  var w=lastWeight(), h=S.body.h, age=S.body.age, act=S.body.act;
  if(!w||!h) return null;
  var bmr = 10*w + 6.25*h - 5*age + 5;
  var tdee = bmr*act;
  var gain = tdee + 300;
  var prot = Math.round(w*1.8);
  var fat  = Math.round(w*1.0);
  var carb = Math.round((gain - prot*4 - fat*9)/4);
  return {
    bmr:Math.round(bmr), tdee:Math.round(tdee), gain:Math.round(gain),
    prot:prot, fat:fat, carb:Math.max(0,carb),
    water:Math.round((w*35+600)/100)*100,
    weekGain:Math.round(w*0.004*10)/10
  };
}

  document.getElementById("mSquat").textContent = mOf(c,"squat")==null?"—":mOf(c,"squat");
  document.getElementById("hCyc").textContent="· цикл "+(r.c+1)+" · неделя "+r.w;
  if(TAB===0) renderToday(); if(TAB===1) renderPlan();
  if(TAB===2) renderProgress(); if(TAB===3) renderBody();
}

function moodCard(){
  var d=selDay(), t=today(), h="";
  h+='<div class="card"><div class="eyebrow">Настроение</div>';
  h+='<div class="mstrip">';
  moodDays(7).forEach(function(x){
    var m=S.mood[x], col=moodColor(m);
    h+='<div class="mday'+(x===d?' sel':'')+'" onclick="pickDay(\''+x+'\')">'+
       '<div class="dw">'+(x===t?"сег":wdShort(x))+'</div>'+
       '<div class="dn">'+x.split("-")[2]+'</div>'+
       '<div class="dot"'+(col?' style="background:'+col+'"':'')+'></div></div>';
  });
  h+='</div>';
  h+='<div class="mbtns">';
  MOODS.forEach(function(m){
    var on=(S.mood[d]===m.v);
    h+='<div class="mbtn'+(on?' on':'')+'" onclick="setMood('+m.v+')"'+
       (on?' style="background:'+m.c+'22;border-color:'+m.c+'"':'')+'>'+
       '<b style="color:'+m.c+'">'+m.v+'</b>'+m.t+'</div>';
  });
  h+='</div>';
  h+='<div class="note">'+(d===t?"Отмечай в конце дня — так честнее.":"Отмечаешь "+fmt(d)+". Нажми на «сег», чтобы вернуться к сегодняшнему дню.")+'</div>';
  h+='</div>';
  return h;
}
var WDS=["вс","пн","вт","ср","чт","пт","сб"];
function wdShort(x){ return WDS[s2d(x).getUTCDay()]; }

function renderToday(){
  var r=currentRef(), s=session(r.c,r.w,r.k), L=S.log[s.id]||{}, t=today();
  var when = s.date===t?"Сегодня":(s.date<t?"Пропущено · "+fmt(s.date):fmt(s.date));
  var h=moodCard();

  h+='<div class="card"><div class="eyebrow">'+when+' · '+s.dayName+' · цикл '+(s.c+1)+' · неделя '+s.w+'</div>';

  if(s.test){
    h+='<h2>Тест максимумов</h2>';
    h+='<div class="meta">разомнись 5–7 минут, отдых между тестами 3 мин</div>';
    h+='<div class="note">По одному подходу до технического отказа в каждом упражнении. Как только техника поплыла — стоп. Ноль в подтягиваниях — нормальный честный результат, программа его учтёт.</div>';
    EX.forEach(function(e){
      var v = mOf(s.c,e.k); v = v==null?"":v;
      h+='<div class="tin"><label>'+e.nm+'</label><input type="number" inputmode="numeric" id="ti_'+e.k+'" value="'+v+'" placeholder="0"></div>';
    });
    h+='<button class="btn" onclick="saveTest()">Записать максимумы</button>';
    if(L.done) h+='<button class="btn ghost sm" onclick="resetSess()">Сбросить</button>';
    h+='</div>';
    document.getElementById("v0").innerHTML=h; drawRest(); return;
  }

  h+='<h2>'+s.dayName+'</h2><div class="meta">три упражнения по порядку сверху вниз</div></div>';

  var totDone=0, totAll=0, reps=0;
  s.blocks.forEach(function(b){
    h+='<div class="card">';
    if(b.locked){
      h+='<div class="exhead"><h3 class="ex">'+b.nm+'<em>ждёт теста</em></h3></div>';
      h+='<div class="note">Сдай тест максимума в субботу первой недели цикла.</div></div>'; return;
    }
    var done=0;
    b.sets.forEach(function(x,i){ if(L[b.ex]&&L[b.ex][i]!=null){done++;reps+=L[b.ex][i];} });
    totDone+=done; totAll+=b.sets.length;
    h+='<div class="exhead"><h3 class="ex">'+b.nm+'<em>'+b.modeName+'</em></h3>';
    h+='<div class="meta">'+b.sets.length+' подх. · макс '+b.M+(b.phase!==undefined?' · фаза '+b.phase:'')+'</div></div>';
    h+='<div class="sets">';
    b.sets.forEach(function(x,i){
      var d=(L[b.ex]&&L[b.ex][i]!=null), nx=(!d&&done===cntBefore(L[b.ex],i));
      h+='<button class="set'+(d?' done':'')+(nx?' active':'')+'" onclick="toggle(\''+b.ex+'\','+i+')">'+
         '<span class="lamp"></span><div class="n">'+(i+1)+'</div>'+
         '<div class="r'+(x.small&&!d?' sm':'')+'">'+(d?L[b.ex][i]:x.t)+'</div>'+
         '<div class="'+(x.amrap?'tag':'u')+'">'+(d?"сделано":(x.amrap?"≈"+x.est:""))+'</div></button>';
    });
    h+='</div><div class="note">'+b.tip+'</div></div>';
  });

  h+='<div class="card flat"><div class="stats">'+
     '<div class="stat"><div class="v">'+totDone+'/'+totAll+'</div><div class="l">Подходов</div></div>'+
     '<div class="stat"><div class="v">'+reps+'</div><div class="l">Повторений</div></div>'+
     '<div class="stat"><div class="v">'+(L.done?"✓":"—")+'</div><div class="l">Статус</div></div></div>';
  h+='<button class="btn" onclick="finish()" '+(totDone?'':'disabled')+'>'+(L.done?"Тренировка закрыта":"Завершить тренировку")+'</button>';
  h+='<button class="btn ghost sm" onclick="resetSess()">Сбросить отметки</button></div>';

  if(L.done){
    h+='<div class="card reward">';
    if(L.quote==null){
      h+='<div class="eyebrow">Награда</div><h2>Тренировка закрыта</h2>';
      h+='<div class="note">Сделанное сегодня уже никуда не денется.</div>';
      h+='<button class="btn" onclick="getQuote()">Получить цитату</button>';
    }else{
      var q=QUOTES[L.quote];
      h+='<div class="eyebrow">'+fmt(s.date)+'</div>';
      h+='<div class="quote">'+q[0]+'</div><div class="qa">'+q[1]+'</div>';
    }
    h+='</div>';
  }

  h+='<div class="rest" id="rest"><div class="row"><div class="lbl">Отдых</div><div class="t" id="rt">0:00</div></div>'+
     '<div class="bar"><i id="rb"></i></div>'+
     '<button class="btn ghost sm" onclick="stopRest()">Пропустить</button></div>';

  document.getElementById("v0").innerHTML=h; drawRest();
}
function cntBefore(arr,i){var n=0;if(!arr)return 0;for(var j=0;j<i;j++)if(arr[j]!=null)n++;return n;}

function renderPlan(){
  var c=curCycle(), t=today(), h="";
  h+='<div class="card"><div class="eyebrow">Цикл '+(c+1)+'</div><h2>Четыре недели</h2>';
  h+='<div class="meta">сб · пн · ср — всегда все три упражнения</div>';
  h+='<div class="note">Порядок внутри тренировки не меняй: подтягивания первыми, пока свежий, приседания последними. Тяжёлые дни разнесены — в один день не сходится силовая работа на все три.</div></div>';

  for(var w=1;w<=4;w++){
    h+='<div class="wk"><h3><span>Неделя '+w+'</span>'+(w===4?'<em>разгрузка</em>':(w===1?'<em>тест</em>':''))+'</h3>';
    DAYS.forEach(function(d){
      var s=session(c,w,d.k), L=S.log[s.id];
      h+='<div class="sess'+(L&&L.done?' ok':'')+(s.date===t?' now':'')+'" onclick="openS(\''+s.id+'\')">';
      h+='<div class="top"><span class="d">'+fmt(s.date)+'</span><span class="nm">'+d.nm+'</span></div>';
      if(s.test){ h+='<div class="lines">тест всех трёх максимумов</div>'; }
      else{
        h+='<div class="lines">';
        s.blocks.forEach(function(b){
          if(b.locked){ h+=b.nm.toLowerCase()+" — ждёт теста<br>"; return; }
          var g={},or=[];
          b.sets.forEach(function(x){ var key=x.amrap?"макс":x.t; if(!g[key]){g[key]=0;or.push(key);} g[key]++; });
          h+=b.nm.toLowerCase()+" · "+MODE[b.mode].toLowerCase()+": "+
             or.map(function(k){return g[k]>1?g[k]+"×"+k:k;}).join(", ")+"<br>";
        });
        h+='</div>';
      }
      h+='</div>';
    });
    h+='</div>';
  }
  h+='<div class="warn">Это полноценная программа на всё тело. Не добавляй её поверх другой — она её заменяет. Три тренировки в неделю, между ними день отдыха, и именно в дни отдыха растут мышцы.</div>';
  document.getElementById("v1").innerHTML=h;
}

function renderBody(){
  var h="", w=lastWeight(), b=S.body, c=calc();

  h+='<div class="card"><div class="eyebrow">Данные для расчёта</div>';
  h+='<div class="frow"><label>Вес сегодня, кг</label>'+
     '<input type="number" step="0.1" inputmode="decimal" value="'+(w!=null?w:"")+'" '+
     'placeholder="72.5" onchange="setBody(\'w\',this.value)"></div>';
  h+='<div class="frow"><label>Рост, см</label>'+
     '<input type="number" inputmode="numeric" value="'+(b.h||"")+'" placeholder="175" '+
     'onchange="setBody(\'h\',this.value)"></div>';
  h+='<div class="frow"><label>Возраст</label>'+
     '<input type="number" inputmode="numeric" value="'+(b.age||"")+'" '+
     'onchange="setBody(\'age\',this.value)"></div>';
  h+='<div class="frow"><label>Активность</label><select onchange="setBody(\'act\',this.value)">'+
     '<option value="1.375"'+(b.act==1.375?" selected":"")+'>Сидячая работа</option>'+
     '<option value="1.55"'+(b.act==1.55?" selected":"")+'>Умеренная</option>'+
     '<option value="1.725"'+(b.act==1.725?" selected":"")+'>Высокая: на ногах весь день</option>'+
     '<option value="1.9"'+(b.act==1.9?" selected":"")+'>Очень высокая: тяжёлый физический труд</option>'+
     '</select></div>';
  h+='<div class="note">Активность считается по работе, а не по тренировкам — три занятия в неделю уже учтены в коэффициенте. При выездах на подстанции с ходьбой по 8 км это «высокая».</div>';
  h+='</div>';

  if(!c){
    h+='<div class="card"><div class="note">Заполни вес и рост — появится расчёт.</div></div>';
    document.getElementById("v3").innerHTML=h; return;
  }

  h+='<div class="card"><div class="eyebrow">Норма на день</div>';
  h+='<div class="kcal">';
  h+='<div class="kc big"><div class="v">'+c.gain+'</div><div class="l">ккал для набора</div></div>';
  h+='<div class="kc"><div class="v">'+c.tdee+'</div><div class="l">поддержание</div></div>';
  h+='<div class="kc"><div class="v">'+c.bmr+'</div><div class="l">основной обмен</div></div>';
  h+='<div class="kc"><div class="v">'+c.prot+' г</div><div class="l">белок</div></div>';
  h+='<div class="kc"><div class="v">'+c.fat+' г</div><div class="l">жиры</div></div>';
  h+='<div class="kc"><div class="v">'+c.carb+' г</div><div class="l">углеводы</div></div>';
  h+='<div class="kc"><div class="v">'+(c.water/1000).toFixed(1)+' л</div><div class="l">вода</div></div>';
  h+='</div>';
  h+='<div class="note">Это оценка, а не истина: формула ошибается на 10–15% в обе стороны. Настоящий ответ дают весы. Если через две недели вес стоит — прибавь 200 ккал. Если растёт быстрее '+c.weekGain+' кг в неделю, значит набирается лишний жир — убери 200.</div>';
  h+='</div>';

  h+='<div class="card"><div class="eyebrow">Про темп набора</div><div class="hint">'+
     'Цель — примерно <b>'+c.weekGain+' кг в неделю</b>, это около '+(c.weekGain*4).toFixed(1)+' кг в месяц. '+
     'Медленнее — не наберёшь, быстрее — наберёшь жиром. И помни про турник: каждый лишний килограмм тела прямо отнимает повторения в подтягиваниях, поэтому спешка тут работает против твоей первой цели.'+
     '</div></div>';

  // вес по дням
  var ks=Object.keys(b.w||{}).sort();
  if(ks.length>1){
    var vals=ks.map(function(k){return b.w[k];});
    var mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals), rng=Math.max(1,mx-mn);
    h+='<div class="card"><div class="eyebrow">Вес · '+ks.length+' записей</div><div class="chartwrap"><div class="chart">';
    ks.slice(-10).forEach(function(k){
      var v=b.w[k], pct=15+((v-mn)/rng)*85;
      h+='<div style="height:'+pct+'%"><span>'+v+'</span><i>'+fmt(k)+'</i></div>';
    });
    h+='</div></div></div>';
  }

  // настроение
  var st=moodStats(30);
  h+='<div class="card"><div class="eyebrow">Настроение за 30 дней</div>';
  if(st.n<3){
    h+='<div class="hint">Отмечено дней: '+st.n+'. Когда наберётся хотя бы неделя, здесь появится средняя и сравнение тренировочных дней с остальными.</div>';
  }else{
    h+='<div class="stats">'+
       '<div class="stat"><div class="v">'+st.all.toFixed(1)+'</div><div class="l">в среднем</div></div>'+
       '<div class="stat"><div class="v">'+(st.train!=null?st.train.toFixed(1):"—")+'</div><div class="l">в дни тренировок</div></div>'+
       '<div class="stat"><div class="v">'+(st.rest!=null?st.rest.toFixed(1):"—")+'</div><div class="l">в остальные</div></div></div>';
    h+='<div class="chartwrap" style="padding-top:6px"><div class="chart" style="height:70px;gap:2px">';
    moodDays(30).forEach(function(d){
      var m=S.mood[d];
      h+='<div style="height:'+(m?(m/5*100):2)+'%;background:'+(m?moodColor(m):"var(--line)")+'"></div>';
    });
    h+='</div></div>';
    h+='<div class="hint">Настроение падает раньше, чем падают цифры в подходах. Если несколько дней подряд на единице-двойке, а тренировки идут через силу — это не лень, это накопленная усталость: недосып, недоед или перебор объёма. Разгрузочная неделя существует ровно для этого.</div>';
  }
  h+='</div>';

  document.getElementById("v3").innerHTML=h;
}

function renderProgress(){
  var h="", sess=0, reps=0;
  for(var k in S.log){ if(S.log[k].done){ sess++; ["pull","push","squat","extra"].forEach(function(e){
    (S.log[k][e]||[]).forEach(function(v){ if(v) reps+=v; }); }); } }

  h+='<div class="card"><div class="eyebrow">Итого</div>';
  h+='<div class="stats"><div class="stat"><div class="v">'+sess+'</div><div class="l">Тренировок</div></div>'+
     '<div class="stat"><div class="v">'+reps+'</div><div class="l">Повторений</div></div>'+
     '<div class="stat"><div class="v">'+S.cycles.length+'</div><div class="l">Циклов</div></div></div>';

  EX.forEach(function(e){
    var cur=null;
    for(var i=S.cycles.length-1;i>=0;i--) if(S.cycles[i][e.k]!=null){cur=S.cycles[i][e.k];break;}
    cur = cur==null?0:cur;
    h+='<div class="prog"><div class="ttl">'+e.nm+'<span>'+cur+' / '+e.goal+'</span></div>'+
       '<div class="trk"><i style="width:'+Math.min(100,cur/e.goal*100)+'%"></i></div></div>';
  });
  h+='</div>';

  EX.forEach(function(e){
    var vals=S.cycles.map(function(c){return c[e.k];}).filter(function(v){return v!=null;});
    if(!vals.length) return;
    var mx=Math.max(e.goal,Math.max.apply(null,vals));
    h+='<div class="card"><div class="eyebrow">'+e.nm+' по циклам</div><div class="chartwrap"><div class="chart">';
    vals.forEach(function(v,i){ h+='<div style="height:'+Math.max(2,v/mx*100)+'%"><span>'+v+'</span><i>'+(i+1)+'</i></div>'; });
    for(var i=vals.length;i<8;i++) h+='<div style="height:2px;background:var(--line)"><i>'+(i+1)+'</i></div>';
    h+='</div></div></div>';
  });

  h+='<div class="card"><div class="eyebrow">Чего ждать</div><div class="hint">'+
     '<b>Приседания</b> растут быстрее всего: 100 за подход реально месяцев за 5–6.<br><br>'+
     '<b>Отжимания</b>: ~20 к концу второго месяца, ~35 к пятому, ~55 к восьмому, 100 примерно через год.<br><br>'+
     '<b>Подтягивания</b> — самая долгая история. Первое чистое обычно приходит через 6–10 недель, десятка примерно через год, а 25 — это горизонт двух-трёх лет. Здесь важно не сравнивать темп с приседаниями, иначе будет казаться, что стоишь на месте.'+
     '</div></div>';

  h+='<div class="card"><div class="eyebrow">Про вес тела</div><div class="hint">'+
     'Подтягивания — единственное упражнение здесь, где каждый лишний килограмм прямо отнимает повторения. Если набор идёт медленно и мышцами, сила обгоняет вес. Если вес пошёл вверх быстрее 400–500 г в неделю, подтягивания встанут — и дело будет не в схеме.'+
     '</div></div>';

  h+='<div class="card"><div class="eyebrow">Уведомления</div>';
  if(notifyOn()){
    h+='<div class="hint">Включены. Когда закончится отдых между подходами, придёт уведомление — можно положить телефон экраном вниз и не следить за таймером.<br><br>Напоминания о самих тренировках приложение слать не может: Android усыпляет фоновые процессы браузера. Для этого поставь повторяющиеся события в календаре или будильник.</div>';
  }else{
    h+='<div class="hint">Разреши уведомления, чтобы получать сигнал об окончании отдыха, даже когда экран погашен.</div>';
    h+='<button class="btn ghost sm" onclick="askNotify()">Разрешить уведомления</button>';
  }
  h+='</div>';

  var seen=(S.seen||[]).length;
  h+='<div class="card"><div class="eyebrow">Цитаты</div>';
  h+='<div class="hint">Открыто '+seen+' из '+QUOTES.length+'. Повторов не будет, пока не закончится весь список.</div></div>';

  h+='<div class="card"><div class="eyebrow">Данные</div>';
  h+='<div class="hint">Всё хранится только на этом телефоне. Раз в месяц делай копию.</div>';
  h+='<button class="btn ghost sm" onclick="exportData()">Сохранить копию</button>';
  h+='<label class="btn ghost sm" style="display:block;text-align:center;cursor:pointer">Загрузить копию'+
     '<input type="file" accept="application/json" style="display:none" onchange="importData(this)"></label>';
  h+='<button class="btn ghost sm" style="border-color:var(--red);color:var(--red)" onclick="hardReset()">Начать заново</button></div>';
  document.getElementById("v2").innerHTML=h;
}

render();

if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js").catch(function(){});
  });
}
